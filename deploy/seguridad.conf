# Las cabeceras de seguridad · ISO 27001 A.8.9 y A.8.26 · 2026-11-09
#
# Ver `docs/AUDITORIA-2026-11-04-hardening-iso-27001.md`, brecha 1. Hasta este
# día nginx no mandaba ninguna.
#
# ── POR QUÉ UN ARCHIVO APARTE Y NO EN EL `server` ─────────────────────────────
#
# **`add_header` NO se hereda si el bloque hijo declara uno propio.** Las tres
# `location` del template tienen su `add_header` —caché, buffering—, así que
# escribirlas sólo en el `server` las perdía en TODAS las respuestas reales: la
# página, los assets y la API. Es el modo de falla clásico de nginx, y no avisa.
# Por eso esto se incluye en el `server` y en cada `location` que tenga su
# propio `add_header`, y `tests/deploy/nginx.test.ts` lo exige.
#
# `always` hace que salgan también en un 404 o un 500, que es justo cuando
# alguien está probando cosas.

# ── LA CSP · estricta, porque el front no carga nada de afuera ───────────────
#
# Medido el 2026-11-09 contra el build de `main`:
#   - `index.html` carga UN script, propio, sin nada en línea.
#   - Las tres fuentes están autohospedadas (`src/tokens/fonts.css`).
#   - Ninguna imagen ni fuente en `data:`.
#   - Siete dependencias, y ninguna inyecta `<style>` ni scripts.
#   - La API va por el mismo origen, así que `connect-src 'self'` alcanza.
#
# **`style-src 'self'` sin `'unsafe-inline'` funciona con React**: la prop
# `style` se aplica por CSSOM (`el.style.x = …`), y eso la CSP no lo bloquea.
# Lo que bloquearía es un `<style>` en línea o un atributo `style` escrito en
# el HTML, y no hay ninguno.
#
# **Si un día la API va a otro origen** —`VITE_API_URL`, ver el `Dockerfile`—,
# ese origen se agrega a `connect-src`. Si no, todo pedido falla con un error
# de CSP en la consola del navegador. Lo mismo para un logo servido desde otro
# host, en `img-src`.
#
# `report-uri` manda cada violación al registro de errores · `/_errores/csp`
# en el template. Es lo que hace visible una regla de más el día que pase.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /_errores/csp" always;

# HTTPS por un año. Sin `includeSubDomains` a propósito: los subdominios de
# `lobueno.co` no son nuestros y no sabemos cuáles sirven sólo HTTP. Si el TLS
# termina en un balanceador, el navegador igual la recibe a través de él; por
# HTTP plano el navegador la ignora, así que mandarla siempre no rompe el local.
add_header Strict-Transport-Security "max-age=31536000" always;

# Que nadie embeba la consola en otro sitio. `frame-ancestors` es la forma
# moderna; `X-Frame-Options` es para navegadores que no leen la CSP.
add_header X-Frame-Options "DENY" always;

add_header X-Content-Type-Options "nosniff" always;

# La URL entera —con `?cliente=…`— sólo viaja dentro del mismo origen.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# El producto no usa ninguna de estas, así que se niegan todas.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

add_header Cross-Origin-Opener-Policy "same-origin" always;
