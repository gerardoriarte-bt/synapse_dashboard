version: '3.8'
services:
  synapse-front:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SYNAPSE_IMAGE:-desarrolloant/synapse-front:dev}
    container_name: ${SYNAPSE_CONTAINER:-synapse-front}
    restart: always
    ports:
      - "${SYNAPSE_PORT:-5173}:${SYNAPSE_PORT:-5173}"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${SYNAPSE_PORT:-5173}
      - NGINX_PORT=${SYNAPSE_PORT:-5173}
      - API_ORIGIN=${API_ORIGIN:-https://qa-synapse-api.lobueno.co}
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:$${NGINX_PORT}/ || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
