openapi: 3.1.0

# ─────────────────────────────────────────────────────────────────────────────
# Synapse · EL CABLE de admin y builder
#
# ⚠ TRANSCRIPCIÓN, y **SIN VERIFICAR CONTRA EL SERVICIO**.
#
# El cable de la consola —`synapse-console-wire.yaml`— se transcribió igual y
# después `npm run humo` lo confirmó contra el servicio corriendo, cero
# diferencias. **Este NO se pudo confirmar**: las ocho rutas cuelgan de
# `AdminOnlyMiddleware` y el usuario de prueba que tenemos es `Planner`, así que
# `GET /admin/tenants` devuelve 403. Comprobado el 2026-09-15.
#
# **Eso baja la confianza de este archivo y hay que decirlo**: describe lo que el
# código de Go dice que devuelve, no lo que se vio llegar. Con un usuario `admin`
# se extiende `tools/humo.py` a estas rutas y se confirma.
#
# ── YA NO HAY RUTAS NUESTRAS ACÁ · 2026-09-26 ───────────────────────────────
#
# Hasta hoy este archivo declaraba **dos cosas distintas**: las operaciones de
# ellos, y CINCO de B4.8 y B4.9 que escribimos nosotros en un fork y que el
# servicio devolvía 404. Iban marcadas con `x-origen: fork`.
#
# **Las cinco las tomaron.** Las tres de rol el 2026-09-25 —y en la ruta que
# propusimos, `/roles/composition`— y el preview en `8633b10`. Medidas una por
# una el 2026-09-26, incluidas las de escritura con un rol descartable. Con eso
# **el fork queda absorbido entero**: no queda nada que volver.
#
# La marca ahora es `x-verificado-en`, igual que en el cable de consola, y dice
# contra qué commit se leyó cada ruta.
#
# ── Y LA VERIFICACIÓN ES POR RUTA, NO POR ARCHIVO ───────────────────────────
#
#   Transcrito el 2026-09-15 desde `AntPack-dev/synapse-api-go`
#   rama   feature/dynamic-dashboard-backend
#   commit 733c13c37dd54b9705e714cbc4718d8aa498092b  (2026-09-11)
#
# **Esa línea es la procedencia del archivo y no dice nada de su estado.** Lo que
# vale es `x-verificado-en` por ruta.
#
# Archivos leídos, y son la autoridad si esto difiere:
#   internal/core/ports/dd_layout_builder_service.go   los DTO del builder
#   internal/core/ports/tenant.go                      TenantAdminOption · B4.1
#   internal/core/domain/dd_layout_version.go          CON etiquetas json desde 8633b10
#   internal/core/domain/dd_tab.go                     CON etiquetas json desde 8633b10
#   internal/core/domain/dd_panel.go                   SIN etiquetas json
#   internal/adapters/handler/dd_layout_builder_handler.go
#   internal/adapters/handler/router.go
#
# ── LA DEUDA QUE NO SE ABSORBE EN SILENCIO ───────────────────────────────────
#
# **Las respuestas mezclan dos convenciones**, y no por diseño:
#
#   · Los DTO del builder —`DDLayoutValidationResult`, `DDLayoutDetail`— llevan
#     etiquetas `json:` y salen en snake_case, como el resto del servicio.
#   · Los structs de DOMINIO —`DDLayoutVersion`, `DDTab`, `DDPanel`— **no llevan
#     ninguna**, así que Go los serializa con el nombre del campo: `ID`,
#     `TenantID`, `Status`, `ColStart`, `OperationalQuestion`.
#
# **Esto rompe los propios tests de Postman del backend**, y esa es la evidencia
# de que es un descuido y no una convención: `scriptCreateDraft` de
# `Synapse — Dashboard dinámico F4.postman_collection.json` afirma
# `lv.status === 'draft'` y lo que llega es `Status`, así que compara `undefined`
# contra `'draft'`. Lo mismo `d.tabs[0].tab.name` en `F4-8`.
#
# Se transcribe como llega —el front lo absorbe en su adaptador, igual que el
# resto del cable— **y se pide arreglarlo**: son tres etiquetas `json:`. Está en
# `docs/PARA-BACKEND.md`.
#
# ── Y UN RIESGO QUE NO ES DE NOMBRES ─────────────────────────────────────────
#
# `DDLayoutVersion` tiene un campo `Tenant Tenant` **sin `json:"-"`**, y
# `domain.Tenant` guarda `PrivateKeyPEM` y `PrivateKeyPassphrase`.
#
# **Hoy no filtra**: ningún repositorio hace `Preload("Tenant")`, así que lo que
# se serializa es un `Tenant` en cero y lo que viaja son cadenas vacías. Pero los
# nombres de los campos de un almacén de credenciales aparecen en una respuesta
# de admin, y **el día que alguien agregue un `Preload` para mostrar el nombre
# del tenant, filtra y nada lo detendría.** Es un `json:"-"` de una línea.
# ─────────────────────────────────────────────────────────────────────────────

info:
  title: Synapse · el cable de admin y builder
  version: 0.1.0-transcripcion-sin-verificar
  description: |
    Las ocho rutas del builder, tal como el código de Go dice que las sirve.

    **Sin verificar contra el servicio**: requieren rol `admin` y el usuario de
    prueba disponible es `planner`.

servers:
  - url: /api/v1

security:
  - bearer: []

tags:
  - name: admin
    description: Namespace `/admin/*` · middleware `AdminOnlyMiddleware`.

paths:
  /admin/tenants:
    get:
      tags: [admin]
      operationId: listTenants
      summary: Los tenants, para elegir cuál se compone
      responses:
        '200':
          description: Lista de tenants
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TenantOption' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/tenants/{tenantId}/layouts:
    x-verificado-en: f70cec2
    get:
      tags: [admin]
      operationId: listLayouts
      summary: Las versiones de layout del tenant · borrador y publicada
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      responses:
        '200':
          description: Versiones
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LayoutVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: createDraft
      summary: Crear un borrador vacío
      description: |
        Responde **201**, no 200. `version_id` es opcional al crear: se puede
        poner al publicar.
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                version_id: { type: string, examples: ['borrador-f4'] }
      responses:
        '201':
          description: El borrador creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LayoutVersion' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/tenants/{tenantId}/catalog:
    get:
      tags: [admin]
      operationId: adminCatalog
      summary: Las métricas del tenant, SIN filtrar por rol
      description: |
        La diferencia con `/config/catalog` es esa: acá no se aplica
        `hidden_metric_ids`, porque quien compone tiene que poder asignar una
        métrica que después un rol no verá.

        Devuelve el mismo `CatalogMetric` que la consola — **ese struct SÍ tiene
        etiquetas `json:`**.
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      responses:
        '200':
          description: Catálogo completo del tenant
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CatalogMetric' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/layouts/{layoutId}:
    x-verificado-en: f70cec2
    get:
      tags: [admin]
      operationId: getLayout
      summary: El layout con sus pestañas y paneles · para el builder
      parameters: [{ $ref: '#/components/parameters/layoutId' }]
      responses:
        '200':
          description: Detalle del layout
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LayoutDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin]
      operationId: updateLayout
      summary: Reemplazar las pestañas y los paneles
      description: |
        **Es un REEMPLAZO COMPLETO**, no un parche: se envía el layout entero y
        lo que no venga se borra.

        **Solo un `draft` es editable** — sobre uno publicado responde 409.

        El cuerpo va en **snake_case**, a diferencia de la respuesta.
      parameters: [{ $ref: '#/components/parameters/layoutId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LayoutUpdateRequest' }
      responses:
        '200':
          description: El layout guardado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LayoutDetail' }
        '409':
          description: El layout está publicado y no se puede editar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/layouts/{layoutId}/validate:
    post:
      tags: [admin]
      operationId: validateLayout
      summary: Validar la composición contra la tabla `blocks`
      description: |
        **Responde 200 aunque la composición sea inválida**: el resultado va en
        `data.valid` y `data.errors`. Un 200 no quiere decir que el layout esté
        bien — quiere decir que la validación corrió.
      parameters: [{ $ref: '#/components/parameters/layoutId' }]
      responses:
        '200':
          description: Resultado de la validación
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ValidationResult' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── B4.8 · CRUD de roles · DEL FORK, NO DESPLEGADO ───────────────────────
  #
  # **El listado vive en `/roles/composition` y NO en `/roles`** · 2026-09-25.
  # `168a761` puso SU listado de roles en `/roles`, y no es un choque de nombres:
  # el suyo contesta qué dashboards ve un rol —`dashboard_ids`— y el nuestro qué
  # ve dentro de un layout —`tab_ids`, `hidden_metric_ids`, `layout_overrides`—
  # más `user_count`. Nos corrimos nosotros para no tocarles la ruta.
  #
  # **Y esto no era teórico.** Mientras el front siguió pidiendo `/roles`, el
  # servicio real contestaba con la forma de ELLOS: de los siete campos que el
  # adaptador lee llegaban dos, `pestanas` quedaba `undefined` donde el tipo
  # promete `string[]`, y `usoPorMetrica` reventaba. **Pantalla de admin en
  # negro**, medido el 2026-09-25.
  /admin/tenants/{tenantId}/roles/composition:
    get:
      tags: [admin]
      operationId: listRoles
      summary: Los roles del cliente, con su composición
      x-verificado-en: 8633b10
      description: |
        **LA TOMARON, y en la ruta que propusimos** · B4.8 · medida el 2026-09-26.
        Acá decía «no la sirve el servicio desplegado», y eso venció el
        2026-09-25: `GET .../roles/composition` responde 200. La colisión con su
        propio `GET .../roles` se resolvió moviendo el NUESTRO, y su ruta quedó
        intacta.

        `user_count` viaja en el listado a propósito: es lo que decide si el rol
        se puede borrar, y la pantalla tiene que poder decirlo **antes** de
        ofrecer el botón, no después de un 409.
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      responses:
        '200':
          description: Los roles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Role' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/tenants/{tenantId}/roles:
    post:
      tags: [admin]
      operationId: createRole
      summary: Crear un rol
      # **Tomada en `8633b10`** · medida el 2026-09-26 con un rol descartable:
      # POST 201, PUT 200, DELETE 200 con `is_active: false`. Ya no es del fork.
      x-verificado-en: 8633b10
      description: |
        **409 si ya existe un rol con ese nombre en el cliente.** El índice único
        es `(tenant_id, name)` y el servicio pregunta antes para poder decir qué
        pasó en vez de devolver el error de Postgres como un 500.
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201':
          description: El rol creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Role' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/roles/{roleId}:
    put:
      tags: [admin]
      operationId: updateRole
      summary: Editar un rol
      # **Tomada en `8633b10`** · medida el 2026-09-26 con un rol descartable:
      # POST 201, PUT 200, DELETE 200 con `is_active: false`. Ya no es del fork.
      x-verificado-en: 8633b10
      description: |
        **Escribe cuatro columnas: `name`, `tab_ids`, `hidden_metric_ids` y
        `layout_overrides`.** `tenant_id` no se toca: un rol no cambia de cliente.

        `layout_overrides` ausente se escribe como `{}`, no se deja intacto.
      parameters: [{ $ref: '#/components/parameters/roleId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200':
          description: El rol editado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Role' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [admin]
      operationId: deleteRole
      summary: Borrar un rol
      # **Tomada en `8633b10`** · medida el 2026-09-26 con un rol descartable:
      # POST 201, PUT 200, DELETE 200 con `is_active: false`. Ya no es del fork.
      x-verificado-en: 8633b10
      description: |
        **204 sin cuerpo.** Y **409 con la razón y el número si tiene usuarios
        asignados** — no borra en cascada: dejaría usuarios sin rol, que es un
        usuario que no puede entrar a ninguna pestaña.
      parameters: [{ $ref: '#/components/parameters/roleId' }]
      responses:
        '204': { description: Borrado }
        '409': { $ref: '#/components/responses/Conflict' }

  # ── B4.9 · preview por rol · DEL FORK, NO DESPLEGADO ─────────────────────
  /admin/layouts/{layoutId}/preview:
    get:
      tags: [admin]
      operationId: previewLayout
      summary: El layout como lo vería un rol
      x-verificado-en: 5924bf2b
      description: |
        ── **YA LA SIRVE EL SERVICIO** · medido el 2026-09-26 ─────────────────

        Acá decía «no la sirve el servicio desplegado, escrita en el fork». La
        tomaron en `8633b10` y **responde 200**. Con eso el fork queda absorbido
        entero: era su última parte pendiente.

        **Y resolvieron la colisión de diseño como propusimos.** `168a761` había
        puesto una compuerta que comparaba el rol SIMULADO contra «es admin», así
        que un borrador se rechazaba siempre; hoy `dd_config_service.go:424`
        compara `sel.CallerRole` —quién pregunta— y el lente es otra cosa.

        ── **EL PARÁMETRO ES `role_id`, NO `roleId`** ─────────────────────────

        Medido: `?roleId=` devuelve **400 · «role_id es requerido y debe ser un
        uuid»**, y `?role_id=` devuelve 200. Nuestro cliente mandaba `roleId`,
        así que F4.12 **nunca pudo haber funcionado** contra el servicio real.

        **No se deduce del resto del cable**: `/config/tabs/{tabId}` usa
        `layoutId` y `dashboardId` en camelCase, en el mismo binario. Dos
        convenciones, y la única forma de saber cuál es cuál es leer el handler.

        **Ojo con un comentario SUYO que es falso**: dice «es lo que hace `GetTab`
        cuando el admin manda `?roleId=`». `GetTab` toma el rol **sólo del
        token**, vía `resolveTenantAndRole` → `c.Get("role_id")`, y **ignora
        cualquier parámetro de rol**. `?roleId=` ahí da 200 porque se descarta,
        no porque se aplique.

        **Viene SIN paneles**, medido: `tabs[]` trae `id`, `name`,
        `operational_question` y `sort_order`, y nada más. Con eso alcanza para
        «qué pestañas ve el CEO y cuáles el Planner»; **no alcanza** para ver qué
        paneles ve, que es lo que `hidden_metric_ids` filtra. Y no hay otra ruta
        que lo dé, porque `GetTab` no acepta lente. Es la razón escrita de por
        qué F4.12 no trae cifras.

        Un `role_id` de otro tenant devuelve **404 y no 403**: un 403 confirmaría
        que el rol existe.
      parameters:
        - $ref: '#/components/parameters/layoutId'
        - name: role_id
          in: query
          required: true
          description: |
            **snake_case**, al revés de `layoutId` y `dashboardId` de
            `/config/tabs`. Se leyó del handler; mandarlo en camelCase da 400.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: El layout filtrado por ese rol
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Preview' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/layouts/{layoutId}/publish:
    post:
      tags: [admin]
      operationId: publishLayout
      summary: Publicar la versión
      description: |
        **Demota el layout publicado anterior del tenant a `draft`.** Solo hay
        uno publicado por tenant, así que publicar cambia lo que ve la consola en
        su próxima carga.

        Rechaza con **422** si hay paneles inválidos.
      parameters: [{ $ref: '#/components/parameters/layoutId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                version_id: { type: string, examples: ['v3'] }
      responses:
        '200':
          description: La versión publicada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LayoutVersion' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ── B4.2 · la reversión · MEDIDA EN SUS COMPUERTAS · 2026-09-28 ───────────
  /admin/layouts/{layoutId}/revert:
    post:
      tags: [admin]
      operationId: revertLayout
      summary: Volver a una versión anterior
      description: |
        **B4.2 · llegó con `5924bf2b`.** Toma la versión destino —`to_layout_id`,
        o por defecto el `previous_layout_id` de la última publicación—, **copia**
        sus pestañas y paneles a un draft nuevo, lo valida contra el catálogo
        actual y lo publica.

        **Nunca se reactiva una versión archivada**, y es la decisión que hace
        auditable el historial: la versión a la que se volvió sigue `archived`, y
        en `GET /admin/layouts/{id}/publications` la vuelta aparece como una
        publicación más con `action: "rollback"`, su actor y su
        `previous_layout_id`.

        Por eso también **puede fallar con 422**: una versión vieja puede ya no
        validar contra el catálogo de hoy.

        ── **LO QUE SE MIDIÓ Y LO QUE NO** ────────────────────────────────────

        **Medidas, las dos compuertas**, sobre un tenant con un solo layout — que
        es justo lo que deja probarlas sin tocar nada:

            POST …/revert  {}                    → 409 CONFLICT_NO_PREVIOUS
            POST …/revert  {to_layout_id: él}    → 409 CONFLICT_REVERT_SELF

        Las dos con mensaje redactado y **en español**, que es lo que muestra que
        los dos mensajes en inglés del cable de consola son handlers sueltos y no
        una política.

        **NO medida, la reversión en sí**: copia y publica, así que cambiaría el
        layout que la consola está sirviendo. El `200` de abajo sale de su
        documento y no de una respuesta vista — se mide cuando haya una segunda
        versión que no sea la de nadie.
      parameters: [{ $ref: '#/components/parameters/layoutId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                to_layout_id:
                  type: string
                  format: uuid
                  description: |
                    A qué versión volver. **Sin esto se usa el
                    `previous_layout_id` de la última publicación**, y si no hay
                    da `409 CONFLICT_NO_PREVIOUS`.
                version_id:
                  type: string
                  description: |
                    El nombre de la versión nueva. Por defecto
                    `rollback-<versión copiada>`.
                  examples: ['rollback-v1']
      responses:
        '200':
          description: 'La versión nueva, ya publicada · **no medida**'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LayoutVersion' }
        '404':
          description: 'El destino no existe o es de otro dashboard · `NOT_FOUND_REVERT_TARGET`'
        '409':
          description: |
            `CONFLICT_NO_PREVIOUS` — no hay a qué volver y no mandaron destino ·
            **medido** · `CONFLICT_REVERT_SELF` — el destino es este mismo layout ·
            **medido** · `CONFLICT_REVERT_TO_DRAFT` — el destino es un borrador.
        '422':
          description: '`VALIDATION_REVERT_TARGET` — la versión vieja ya no valida contra el catálogo actual'

  # ── B3.9 · el agente por tenant · TRANSCRITO DE 82da946 ──────────────────
  /admin/tenants/{tenantId}/agents:
    get:
      tags: [admin]
      operationId: listAgents
      summary: Los agentes configurados para el cliente
      x-origen: 82da946
      description: |
        **Transcrita el 2026-09-21 desde `82da946`**, leyendo
        `internal/core/ports/agent.go` —`AgentAdminDTO`— y
        `internal/adapters/handler/agent_handler.go`.

        **`AgentAdminDTO` SÍ tiene etiquetas `json:` y sale en snake_case.** Al
        transcribirla era la excepción —el resto de admin serializaba structs de
        dominio en PascalCase— y desde `8633b10` es la regla: B4.10 les puso
        etiquetas a los tres structs de layout. No se deduce del patrón: se leyó,
        las dos veces.

        **Nunca incluye credenciales** — lo dice el comentario del DTO y lo
        confirma la lista de campos. Lo que sí trae y **§7.3 prohíbe mostrar**
        es `snowflake_db`, `snowflake_schema` y `warehouse`: «ni base, ni rol
        técnico, ni grants, ni warehouse». Se transcriben porque describir el
        cable no es pintarlo.

        **Devuelve también los inactivos.** `is_active` es una baja lógica que
        alguien apretó, no una verificación de que el acceso funcione.
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      responses:
        '200':
          description: Los agentes del cliente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AgentAdmin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── B4.16 · los usuarios del cliente ─────────────────────────────────────
  /admin/users:
    x-verificado-en: 8633b10
    get:
      tags: [admin]
      operationId: listAllUsers
      summary: Todos los usuarios de la plataforma, con su cliente
      description: |
        ── **CIERRA EL HUECO DE ALCANCE DE A3** · B4.17, medida el 2026-09-26 ──

        El dibujo de A3 declara `ALCANCE · PLATAFORMA` y su resumen dice «17
        usuarios · 2 clientes con usuarios». Hasta `6e521cc` la única ruta era
        **por cliente**, y `UserList` lo declaraba como hueco con su razón: «no se
        compensa pidiendo N veces la ruta — un total armado acá se leería como un
        número de plataforma y sería una suma nuestra».

        **Esta ruta lo da del lado del servidor**, y con `tenant_name` por usuario,
        que es la columna `CLIENTE` del dibujo.

        **`total` y `tenants` los cuenta el servicio**, no nosotros. Es la
        diferencia que la razón del hueco señalaba: si un cliente fallara, un
        total nuestro bajaría sin decirlo.
      responses:
        '200':
          description: Los usuarios de todos los clientes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UsersPlatform' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/tenants/{tenantId}/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: Los usuarios del cliente, con su rol
      description: |
        **Transcrita el 2026-09-25 desde `1e080ee`**, leyendo la respuesta del
        servicio corriendo campo por campo.

        **Va colgada del tenant, y A3 está dibujada con alcance PLATAFORMA** —su
        resumen dice «17 usuarios · 2 clientes con usuarios»—. La diferencia se
        declara en la pantalla; no se compensa pidiendo N veces esta ruta, que
        daría un número que parece de plataforma y es una suma nuestra.

        **`/admin/users` NO existe** y da 404: la lista es por cliente.
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      responses:
        '200':
          description: Los usuarios del cliente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── B2.13 · salud de feeds por fuente ────────────────────────────────────
  /admin/tenants/{tenantId}/feeds:
    get:
      tags: [admin]
      operationId: listFeeds
      summary: Las fuentes de datos del cliente y su salud
      description: |
        **Transcrita el 2026-09-25 desde `1e080ee`**, leyendo la respuesta del
        servicio corriendo campo por campo.

        Es la ruta que A5 necesita, y se pidió **como ruta y no como un campo
        `estado` en la métrica**: el estado de una métrica se DERIVA de
        `frescura > cadencia × tolerancia`, y guardarlo crearía dos fuentes para
        el mismo hecho que se separan en el primer feed atrasado.

        **`status` llega igual y el front NO lo usa.** Está acá porque el
        servicio lo manda, no porque la pantalla lo lea · §PEN:A5, al pie: «el
        estado no se escribe, se deriva».
      parameters: [{ $ref: '#/components/parameters/tenantId' }]
      responses:
        '200':
          description: Las fuentes, con su cadencia, su frescura y sus métricas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Feed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    tenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    layoutId:
      name: layoutId
      in: path
      required: true
      schema: { type: string, format: uuid }
    roleId:
      name: roleId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Identificador mal formado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: El JWT no es de rol `admin`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: No existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unprocessable:
      description: Composición inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: |
        Choca con una regla · nombre de rol duplicado, o un rol con usuarios
        asignados. **El mensaje dice qué hacer**, no «conflicto».
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:

    UsersPlatform:
      type: object
      description: |
        El sobre de `GET /admin/users` · B4.17 · medido el 2026-09-26.

        **No es un arreglo desnudo**, al revés de casi todo el resto del cable:
        trae los dos conteos que el dibujo de A3 pinta en su resumen.
      required: [total, tenants, users]
      properties:
        total:
          type: integer
          description: |
            Usuarios en toda la plataforma. **Lo cuenta el servicio.**
        tenants:
          type: integer
          description: |
            Clientes **con al menos un usuario**, que es lo que el dibujo dice —«2
            clientes con usuarios»— y no la cantidad de clientes.
        users:
          type: array
          items: { $ref: '#/components/schemas/User' }

    User:
      type: object
      description: |
        Un usuario del cliente · `1e080ee`.

        **Lo que A3 dibuja y esto NO trae**, declarado y no inventado: el estado
        de INVITACIÓN PENDIENTE —`is_active` sólo distingue activo de
        suspendido—, quién dio de alta —el dibujo pone «POR M. BENÍTEZ»— y la
        paginación, que la ruta no ofrece.
      required: [id, tenant_id, email, first_name, last_name, role, role_id, is_active, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        # **Sólo lo trae `GET /admin/users`**, no la ruta por cliente: ahí sería
        # redundante porque el cliente ya es el de la URL. Medido el 2026-09-26.
        # Es la columna `CLIENTE` de A3, y por eso no es opcional por gusto: sin
        # ella el alcance de plataforma pinta una tabla sin decir de quién es
        # cada fila.
        tenant_name: { type: string, examples: ['Under Armour México'] }
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string, description: Puede venir vacío }
        role: { type: string, description: 'El nombre del rol · admin, planner' }
        role_id: { type: string, format: uuid, description: Para enlazar con la ficha }
        last_login_at:
          type: [string, 'null']
          format: date-time
          description: |
            **`null` cuando nunca entró**, que el dibujo pinta como «Nunca». No
            es un error ni un cero.
        is_active:
          type: boolean
          description: |
            Activo o suspendido. **No distingue la invitación pendiente**, que el
            dibujo declara como un tercer estado.
        created_at: { type: string, format: date-time, description: El alta }

    Feed:
      type: object
      description: |
        Una fuente de datos del tenant · `1e080ee`.

        **Los cuatro campos que importan son `cadence_hours`,
        `tolerance_factor`, `freshness_hours` y `last_load_at`**: de ahí sale el
        estado, derivado. El resto es lo que la tabla de §PEN:A5 pinta.

        **`layer` NO llega**, y el dibujo la pone como columna. Declarado como
        hueco en F4.24 en vez de inventarlo.
      required: [id, tenant_id, key, name, cadence_hours, tolerance_factor, metric_count, metric_keys, is_active]
      properties:
        # ── Los cuatro que faltaban · 2026-09-26 ──────────────────────────────
        #
        # **No son campos nuevos suyos: faltaban en NUESTRA transcripción**, desde
        # `1e080ee`. Se transcribió lo que la pantalla iba a pintar y se dejaron
        # afuera los que no se pintan, y eso es lo que el chequeo bidireccional
        # ve como deriva — con razón: un esquema que describe medio cable no sirve
        # para saber si el cable cambió.
        #
        # `id` es el que más importa de los cuatro: es lo que necesitan
        # `GET/PUT/DELETE /admin/tenants/{tenantId}/feeds/{feedId}`, que existen
        # y todavía no transcribimos.
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        key: { type: string }
        name: { type: string, description: El nombre que ve una persona }
        gold_table:
          type: string
          description: Puede venir vacío · una fuente sin tabla Gold todavía
        cadence_hours: { type: integer, description: Cada cuántas horas se espera una carga }
        tolerance_factor: { type: integer, description: El múltiplo de la cadencia que se tolera }
        source_labels:
          type: array
          items: { type: string }
          description: Los textos de `source` de las métricas que caen en esta fuente
        last_load_at:
          type: [string, 'null']
          format: date-time
          description: |
            **`null` cuando nunca cargó**, que es como llegan las cuatro del
            tenant de prueba el 2026-09-25. No es un error: es una fuente sin
            Gold todavía.
        last_load_checked_at: { type: [string, 'null'], format: date-time }
        rows_processed: { type: [integer, 'null'] }
        rows_failed: { type: [integer, 'null'], description: Las que fallaron la validación Silver→Gold }
        freshness_hours:
          type: [number, 'null']
          description: Horas desde la última carga. `null` si nunca cargó
        status:
          type: string
          description: |
            **El front NO lo lee.** Lo manda el servicio y la pantalla deriva el
            suyo · §PEN:A5. Se transcribe para que la próxima persona que lo vea
            sepa que la omisión es deliberada.
        metric_count: { type: integer }
        metric_keys:
          type: array
          items: { type: string }
          description: Las métricas que dependen de esta fuente
        is_active: { type: boolean }
    Envelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean, enum: [true] }

    ErrorResponse:
      type: object
      description: El mismo de la consola · `error` es una CADENA.
      required: [success, error, code]
      properties:
        success: { type: boolean, enum: [false] }
        error: { type: string }
        code:
          type: string
          description: |
            **B0.4 · llegó con `5924bf2b`**, y acá es donde más rinde: las rutas
            de administración son las que tienen reglas de negocio con estado.

            `FAMILIA_DETALLE`, y **se decide por la familia** — ellos suman
            detalles sin avisar. Ver el cable de consola para el juego completo.

            Los de acá, declarados por ellos: `CONFLICT_NOT_DRAFT`,
            `VALIDATION_LAYOUT`, `VALIDATION_CHAT_SUGGESTIONS`,
            `NOT_FOUND_LAYOUT`, `NOT_FOUND_ROLE`, `AUTH_DRAFT_PREVIEW`,
            `VALIDATION_THEME`, `VALIDATION_DASHBOARD_NOT_VISIBLE`,
            `CONFLICT_NO_PREVIOUS`, `CONFLICT_REVERT_SELF`,
            `NOT_FOUND_REVERT_TARGET`, `VALIDATION_REVERT_TARGET`.

            **Medidos acá**: `AUTH_FORBIDDEN` con token de planner,
            `CONFLICT_NO_PREVIOUS` y `CONFLICT_REVERT_SELF` en el revert.
          examples: [CONFLICT_NO_PREVIOUS, AUTH_FORBIDDEN, VALIDATION_LAYOUT]

    TenantOption:
      type: object
      description: |
        `ports.TenantAdminOption` · snake_case.

        ── **B4.1 LLEGÓ** · 2026-09-26, medido contra `8633b10` ────────────────

        Acá había dos campos, `id` y `name`, y eso era el bloqueo de **A1 · la
        banda de clientes**: el dibujo pide cinco columnas y la ruta daba el
        nombre. Estaba escrita en nuestro fork —`8c03132`— esperando que la
        tomaran, y la escribieron ellos.

        **El nombre del esquema ya no describe lo que es** —una «opción» de un
        selector— pero no se renombra: `admin-generated.ts` se genera de acá y el
        renombre tocaría los consumidores sin cambiar un solo campo.

        **Dos de las cinco columnas llegan en `null`**, y desde el 2026-09-26
        por razones DISTINTAS · `docs/DECISIONES-2026-09-26-estado-y-vertical.md`.
        Hasta acá compartían una —«esperan que definamos sus valores»— y ya no:

          · `status` **está decidido**: `ACTIVO`, `PILOTO`, `SUSPENDIDO`. Los dos
            primeros los dibuja el `.pen` en A1, así que son transcripción. Ahora
            falta **la columna**: su `Tenant` de `internal/core/domain/tenant.go`
            no la tiene, medido contra `6e595e3`.

            **Acá NO se declara el enum, a propósito.** Este archivo transcribe
            lo que el servicio emite, y emite `null`; declararlo sería afirmar
            una forma que nadie manda. El día que el valor llegue, el enum se
            cierra en el ADAPTADOR, que es donde ya se cierran `shape`, `family`
            y `layer` — el cable los trae como `string` libre.

            Y `SUSPENDIDO` no es sólo una columna: es una compuerta en el login,
            que exceptúa a los super-admins.

          · `vertical` **se retiró**. §3.5 de `design.md` declara `vertical` Y
            `plantillaOrigen` —dos campos— y el `.pen` dibuja el par en la misma
            celda de A1: `Retail · apparel` sobre `retail_apparel_v2`. Es la
            cabeza de la herencia de §3.4, que no existe de ninguno de los dos
            lados. **Su `null` no es un pendiente de nadie.**
      required: [id, name, label, locale, currency, timezone, user_count, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        label:
          type: string
          description: |
            **La forma corta** · llegó en `f70cec2` con `tenant.label` del cable
            de consola, y acá se transcribió tarde: lo encontró `npm run humo`
            el 2026-09-28, no una lectura.

            **Y acá SÍ puede venir vacía**, a diferencia de `/config/me`, donde
            el servicio la hace caer a `name`. Medido ese día: el tenant
            sembrado la trae en `""`. Quien la pinte cae a `name` — es lo que
            hace A1.
          examples: ['UA México']
        locale: { type: string, examples: ['es-CO'] }
        currency: { type: string, examples: ['COP'] }
        timezone: { type: string, examples: ['America/Bogota'] }
        user_count:
          type: integer
          description: |
            Usuarios ACTIVOS del tenant. **Cero es un valor válido y no un
            hueco**: un cliente recién creado no tiene usuarios hasta que alguien
            acepte la invitación.
        last_published_at:
          type: ['string', 'null']
          format: date-time
          description: '`null` si nunca se publicó un layout.'
        worst_feed_status:
          type: string
          description: |
            El PEOR de los feeds del tenant, ya reducido por el servicio. Vale
            `unknown` cuando ningún feed cargó nunca — que es distinto de estar
            vencido, y por eso no se colapsa con él.

            **Los tres valores se leyeron de `dashboard.FeedStatus`**, no se
            dedujeron: acá había `examples: ['unknown', 'ok', 'late', 'stale']`
            con `ok` y `late` INVENTADOS, escritos el 2026-09-26 mirando una
            respuesta que sólo traía `unknown`. La pantalla mostró `fresh` y ahí
            se fue a leer el código.

            **Y el orden importa**: `WorstStatus` rankea `stale > unknown >
            fresh`, o sea que **no saber es peor que estar al día**. Es una
            decisión de producto y no un detalle: un cliente cuyas fuentes nunca
            cargaron no se presenta como sano.
          enum: [fresh, unknown, stale]
        worst_feed_freshness_hours:
          type: ['number', 'null']
          description: |
            Horas desde la última carga del peor feed. **`null` es «nunca cargó»
            y 0 es «recién»** — la misma distinción que `FeedHealth` ya sostiene
            del lado nuestro, y confundirlas pinta un feed muerto como sano.
        status:
          type: ['string', 'null']
          description: '`null` hasta que definamos los valores · pedido abierto.'
        vertical:
          type: ['string', 'null']
          description: '`null` hasta que definamos los valores · pedido abierto.'
        created_at: { type: string, format: date-time }

    CatalogMetric:
      type: object
      description: |
        `domain.DDCatalogMetric`, el mismo de `/config/catalog`. **Con etiquetas
        `json:`**, así que sale en snake_case. Ver `synapse-console-wire.yaml`
        para el detalle de cada campo — no se duplica acá.
      required: [id, tenant_id, key, name, shape, family, layer, source, base, min_grain, dimensions, catalog_version]
      # **`additionalProperties: true` acá desactiva el chequeo de campos no
      # declarados** para este esquema, y es a propósito: el detalle de la métrica
      # vive en `synapse-console-wire.yaml` y duplicarlo es cómo se desincronizan.
      # El costo es que `humo` no puede medirla de este lado, y queda dicho.
      #
      # `tenant_id` y `dimensions` estaban en `required` y NO en `properties`
      # —corregido el 2026-09-26—: un esquema que exige un campo que no declara
      # es una transcripción a medias.
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        dimensions:
          type: array
          items: { type: string }
        key: { type: string }
        name: { type: string }
        shape: { type: string }
        family: { type: string }
        layer: { type: string }
        source: { type: string }
        base: { type: string }
        min_grain: { type: string }
        catalog_version: { type: integer }

    # ── LOS STRUCTS DE DOMINIO · en snake_case desde `8633b10` ───────────────
    #
    # **Esta sección se llamaba «LO QUE SALE EN PascalCase»** y era la mitad del
    # archivo que había que leer con cuidado. B4.10 la disolvió: ya no hay dos
    # convenciones en el mismo cable.

    LayoutVersion:
      type: object
      description: |
        `domain.DDLayoutVersion`.

        ── **PASÓ DE PascalCase A snake_case** · 2026-09-26, `8633b10` ─────────

        Acá decía «serializado SIN etiquetas `json:`, las claves son los nombres
        de los campos de Go», y era cierto: medido el 2026-09-16 contra
        `82da946`, el struct **no tenía ni una etiqueta**, así que Go serializaba
        `ID`, `TenantID`, `Status`. `CLAUDE.md` lo registró como «el PascalCase
        quedó confirmado y no deducido».

        **`8633b10` les puso etiquetas a los tres structs** —B4.10—, y con eso
        las claves cambiaron todas. No lo vio ninguna persona: lo encontró
        `humo` la primera vez que supo mirar los campos que el servicio manda y
        el cable no declara.

        **Y rompía en silencio.** `src/api/admin.ts` leía quince campos en
        PascalCase y los quince pasaron a `undefined`; el peor no fallaba —
        `ESTADOS[w.Status] ?? 'borrador'` afirmaba que TODO layout era borrador,
        incluido el publicado.

        `Tenant` ya no viaja: `a643cfe` le puso `json:"-"` a él y a las dos
        credenciales, que es el hallazgo que les reportamos el 2026-09-22.
      required: [id, tenant_id, dashboard_id, status, version_id]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        dashboard_id:
          type: string
          format: uuid
          description: |
            **Nuevo con el multi-dashboard.** Un tenant puede tener varios
            dashboards y cada layout cuelga de uno · F5.1.
        status:
          type: string
          description: |
            Uno `published` por **dashboard**, no por tenant: publicar demota al
            anterior del mismo dashboard.
          enum: [draft, published]
        version_id:
          type: string
          description: Etiqueta legible. Cadena vacía si nunca se puso.
        published_at: { type: ['string', 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LayoutDashboard:
      type: object
      description: |
        **Nuevo el 2026-09-26.** `GET /admin/layouts/{layoutId}` pasó a devolver
        el dashboard al que pertenece el layout, además de `layout` y `tabs`.
        Es lo que deja al builder decir DE QUÉ dashboard está editando una
        versión, que con varios por tenant deja de ser obvio.
      required: [id, tenant_id, name, slug, is_default]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string, examples: ['Overview'] }
        slug: { type: string, examples: ['overview'] }
        is_default:
          type: boolean
          description: El que resuelve cuando el rol no declara preferencia.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LayoutTab:
      type: object
      description: '`domain.DDTab`, también en snake_case desde `8633b10`.'
      required: [id, layout_version_id, name, sort_order]
      properties:
        id: { type: string, format: uuid }
        layout_version_id: { type: string, format: uuid }
        name: { type: string }
        operational_question:
          type: string
          description: |
            La pregunta operativa. Cadena vacía si no se puso — **y el producto
            dice que una pestaña que no contesta una pregunta no se compone**,
            así que el builder no la deja vacía aunque el backend sí.
        sort_order: { type: integer }
        key:
          type: string
          description: |
            **La identidad estable de la pestaña dentro del dashboard** · llegó
            en `f70cec2`, y es lo que faltaba para que una restricción de rol
            sobreviva a una publicación: `dd_tabs.id` se recrea en cada versión
            y `key` no.

            Medido el 2026-09-28: la pestaña sembrada sale `overview`.

            **Es único por versión de layout**, no por tenant.
        icon:
          type: string
          description: |
            Cadena vacía si no se puso. El mismo campo que el cable de consola
            declara en `TabMeta.icon`.
        chat_suggestions:
          type: array
          description: |
            Las preguntas sugeridas de la pestaña. Arreglo vacío si no hay.
          items: { type: string }
        role_ids:
          type: array
          description: Vacío significa «la ven todos los roles».
          items: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LayoutPanel:
      type: object
      description: |
        `domain.DDPanel`, en snake_case desde `8633b10`. **Ojo con `type`**: en la
        base la columna es `block_type` y acá el campo es `type`.
      required: [id, tab_id, metric_id, type, col_start, col_span, row_span]
      properties:
        id: { type: string, format: uuid }
        tab_id: { type: string, format: uuid }
        metric_id: { type: string, format: uuid }
        type: { type: string }
        col_start: { type: integer, minimum: 1, maximum: 12 }
        col_span: { type: integer }
        row_span: { type: integer }
        chart:
          type: string
          description: |
            **Cuál de los 49 gráficos dibuja el panel** · llegó en `f70cec2`,
            pedido por nosotros. Va **junto a `type` y no en su lugar**: el
            bloque decide la anatomía del cuerpo y el gráfico decide el dibujo,
            y 16 de los 49 sirven más de una forma.

            Cadena vacía = el gráfico por defecto del bloque. Los doce paneles
            publicados salen así, medido el 2026-09-28.

            **No lo validan contra el repertorio** —«eso es del front, que tiene
            los 49 y sus mínimos»—, así que un id inventado llega tal cual y el
            cuerpo lo declara con `UnknownPlotState`. Descartarlo en el
            adaptador haría que el panel cayera al gráfico por defecto sin que
            nadie se entere.
        note:
          type: string
          description: |
            La nota al pie del panel. Cadena vacía si no se puso.
        options:
          type: object
          description: Los nombres van en inglés · ver `PARAMS` del adaptador.
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LayoutDetail:
      type: object
      description: |
        `ports.DDLayoutDetail`. **La mezcla de convenciones se terminó**: acá
        decía «las dos claves de afuera SÍ tienen etiqueta y lo de adentro no,
        esa mezcla es toda la deuda». Desde `8633b10` todo va en snake_case, y
        el builder ya manda y recibe la misma forma.
      required: [layout, tabs]
      properties:
        layout: { $ref: '#/components/schemas/LayoutVersion' }
        dashboard: { $ref: '#/components/schemas/LayoutDashboard' }
        tabs:
          type: array
          items:
            type: object
            required: [tab, panels]
            properties:
              tab: { $ref: '#/components/schemas/LayoutTab' }
              panels:
                type: array
                items: { $ref: '#/components/schemas/LayoutPanel' }

    # ── LO QUE VA EN snake_case ──────────────────────────────────────────────

    LayoutUpdateRequest:
      type: object
      description: |
        `ports.DDLayoutUpdateRequest`. **La asimetría se terminó el 2026-09-26**:
        acá decía «el cuerpo va en snake_case y la respuesta en PascalCase, el
        builder manda una forma y recibe otra». Desde `8633b10` las dos van en
        snake_case.
      required: [tabs]
      properties:
        tabs:
          type: array
          items: { $ref: '#/components/schemas/TabInput' }

    TabInput:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Omitir —o mandar el UUID cero— **genera una pestaña nueva**. Mandar un
            UUID existente conserva el id al reemplazar el contenido. Es la
            diferencia entre editar y recrear, y no la avisa nada.
        name: { type: string }
        key:
          type: string
          description: |
            Opcional. **Se SLUGIFICA, que es más de lo que su documento dice**
            —ahí figura «recortado»—. Medido el 2026-09-28 contra `f70cec2`:
            `"  MI-Clave  "` se guarda como `mi-clave`.

            **Omitirla la deriva del nombre**, quitando los acentos:
            `"Visión General"` → `vision-general`.

            **Repetida dentro del mismo layout es `422 VALIDATION_TAB_KEY`**, y
            el mensaje nombra las dos pestañas: `tab "Otra": la key "repe" ya la
            usa la pestaña "Una"`.
        operational_question: { type: string }
        sort_order:
          type: integer
          description: 'Default si viene 0: el índice del arreglo + 1.'
        role_ids:
          type: array
          items: { type: string, format: uuid }
        panels:
          type: array
          items: { $ref: '#/components/schemas/PanelInput' }

    PanelInput:
      type: object
      required: [metric_id, type]
      properties:
        id: { type: string, format: uuid }
        metric_id: { type: string, format: uuid }
        type: { type: string }
        chart:
          type: string
          description: |
            Opcional · **se recorta y se baja a minúsculas**. Medido el
            2026-09-28: `"  Waterfall  "` se guarda como `waterfall`.

            Omitirlo deja cadena vacía, que es el gráfico por defecto del
            bloque. **No se valida contra el repertorio** · ver `LayoutPanel`.
        note:
          type: string
          description: 'Opcional · se recorta. Medido: `" una nota "` → `una nota`.'
        col_start: { type: integer, description: 'Default si viene 0: 1.' }
        col_span: { type: integer, description: 'Default si viene 0: 3.' }
        row_span: { type: integer, description: 'Default si viene 0: 4.' }
        options:
          type: object
          additionalProperties: true

    ValidationResult:
      type: object
      description: '`ports.DDLayoutValidationResult` · SÍ tiene etiquetas `json:`.'
      required: [valid, errors]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ValidationIssue' }

    ValidationIssue:
      type: object
      description: |
        Trae `tab_id` y `panel_id` cuando aplica, **así que el error se puede
        mostrar SOBRE el panel** y no en una lista al pie.
      required: [message]
      properties:
        tab_id: { type: ['string', 'null'], format: uuid }
        panel_id: { type: ['string', 'null'], format: uuid }
        field: { type: string }
        message: { type: string }

    # ── B4.8 y B4.9 · DEL FORK, NO DESPLEGADO ────────────────────────────────

    Role:
      type: object
      description: |
        `ports.DDRoleDTO`, snake_case entero. Acá decía «a diferencia de
        `LayoutVersion` y compañía», y **B4.10 cerró esa diferencia** en
        `8633b10`: ya no hay dos convenciones en el cable de admin.
      required: [id, tenant_id, name, tab_ids, tab_keys, hidden_metric_ids, user_count]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string, examples: ['Planner'] }
        tab_keys:
          type: array
          description: |
            **La restricción de rol POR KEY** · llegó en `de881e1`, el 2026-09-29,
            y es lo que hace que un rol restringido **sobreviva a publicar**.

            `roles.tab_ids` apunta a `dd_tabs.id`, y ese id **se recrea en cada
            versión de layout**: la primera publicación real desde el builder
            dejaba sin pestañas a todo rol con restricción. `key` es estable.

            **Verificado en sustancia y no por la existencia del campo** · se le
            puso a `planner` un `tab_ids` con un uuid inexistente dejándole
            `tab_keys: ["overview"]`, y `GET /config/me` le devolvió su pestaña
            igual.

            **Resuelve en este orden**: si hay `tab_keys` manda `key`; si está
            vacía cae a `tab_ids`; las dos vacías = todas. Y la migración la
            rellenó una vez desde los `tab_ids` existentes, así que los roles
            sembrados quedaron protegidos sin tocar la consola.

            **Siempre lista, nunca `null`.**
          items: { type: string, examples: [overview] }
        tab_ids:
          type: array
          description: Vacío significa «ve todas las pestañas».
          items: { type: string, format: uuid }
        hidden_metric_ids:
          type: array
          description: |
            **Oculta, NO impide.** El servidor vuelve a verificar en
            `/config/catalog` y en el batch: un rol que oculta una métrica no es
            un rol que no pueda pedirla.
          items: { type: string, format: uuid }
        layout_overrides:
          type: object
          description: |
            Por pestaña y por panel · `col_start`, `col_span`, `row_span`,
            `options`. **No muta el layout publicado**: `GetTab` los aplica al
            responder.
          additionalProperties: true
        user_count:
          type: integer
          description: Cuántos usuarios tienen el rol. Con uno o más, borrar da 409.
        # ── Los dos del multi-dashboard · medidos el 2026-09-26 ───────────────
        #
        # Llegaron con `168a761` y los escribe `PUT /admin/roles/{roleId}/dashboards`,
        # que NO transcribimos todavía: es B4.10 del lado de ellos y F5.1 del
        # nuestro, y una ruta transcrita que nadie llama envejece sin avisar.
        #
        # Se declaran porque **vienen en la respuesta** de las cuatro rutas de
        # rol, y un campo que llega sin declarar es la deriva que costó ocho días.
        dashboard_ids:
          type: array
          description: |
            Los dashboards que el rol puede ver. Vacío significa «los que el
            tenant tenga por default», no «ninguno».
          items: { type: string, format: uuid }
        default_dashboard_id:
          type: ['string', 'null']
          format: uuid
          description: |
            El que abre primero. **`null` es lo normal**: la resolución cae a
            `preferencia del usuario > rol > default del tenant`, y este campo es
            el escalón del medio.
        is_active:
          type: boolean
          description: |
            `DELETE /admin/roles/{roleId}` **desactiva, no borra** — medido el
            2026-09-26: responde 200 con `{id, is_active: false}`. La auditoría de
            quién vio qué se conserva.

    RoleInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        tab_ids:
          type: array
          items: { type: string, format: uuid }
        hidden_metric_ids:
          type: array
          items: { type: string, format: uuid }
        layout_overrides:
          type: object
          description: 'Ausente se escribe como `{}`: «sin overrides» es un estado, no una omisión.'
          additionalProperties: true

    Preview:
      type: object
      description: |
        `ports.DDPreviewResponse`.

        ── **REESCRITO CONTRA EL SERVICIO** · 2026-09-26, `8633b10` ────────────

        Acá estaba la forma de NUESTRO fork, y la suya es otra. Se transcribió a
        ciegas porque el servicio devolvía 404; ahora responde y se midió:

          nuestra           suya
          `role_id`         `role.id`      · anidado
          `role_name`       `role.name`
          —                 `dashboard_id` · nuevo con el multi-dashboard
          —                 `status`       · para avisar que es un borrador
          `tabs[].tab`      `tabs[]`       · la pestaña SIN envoltorio
          `tabs[].panels`   —              · **no vienen**
          `without_payloads` —             · la ausencia no se declara

        **La diferencia que importaba era `panels`, y se cerró** ·
        2026-09-28, `5924bf2b`. Hasta acá decía que su preview devolvía sólo QUÉ
        PESTAÑAS ve cada rol, y que eso era el techo de F4.12.

        **Ahora `tabs[]` trae `panels[]`**, filtrados exactamente como los vería
        ese rol: sin las métricas de `hidden_metric_ids` y con los
        `layout_overrides` aplicados. Es el mismo código que sirve
        `GET /config/tabs/{tabId}`, así que no pueden divergir.

        Medido con los dos lentes sobre el mismo layout publicado:

          lente `admin`     1 pestaña · **12** paneles · `col_span` 12
          lente `planner`   1 pestaña · **9** paneles · `col_span` **4**

        Los 9 contra 12 son `hidden_metric_ids`; el `col_span` 4 contra 12 es un
        override. **Las dos mitades de lo que F4.12 promete, en una sola
        respuesta.**

        **Lo que sigue sin existir es el lente en la consola**:
        `GET /config/tabs/{tabId}` resuelve el rol desde el token y no lo acepta.
        No hace falta para F4.12 — el preview ya lo da — y conviene no volver a
        pedirlo.
      required: [layout_id, dashboard_id, status, role, tabs]
      properties:
        layout_id: { type: string, format: uuid }
        dashboard_id: { type: string, format: uuid }
        status:
          type: string
          description: |
            El del layout que se está previsualizando. **Un borrador se puede
            previsualizar y un rol no-admin no lo vería**: la compuerta mira quién
            pregunta, no a quién se simula.
          enum: [draft, published]
        role:
          type: object
          description: El lente. Anidado, no dos campos planos.
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, examples: ['planner'] }
        tabs:
          type: array
          description: |
            Sólo las que el rol puede ver, por `roles.tab_ids`. Sin envoltorio
            `{tab, panels}`: la pestaña va plana, **con sus paneles adentro**
            desde el 2026-09-28.
          items:
            type: object
            required: [id, name, key, operational_question, sort_order, icon, chat_suggestions, panels]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              key:
                type: string
                description: |
                  **La identidad estable de la pestaña** · llegó en `f70cec2` y
                  acá se transcribió tarde: lo encontró `npm run humo` el
                  2026-09-28, no una lectura del diff.

                  Es la que va a usar `roles.tab_keys` para decidir qué ve cada
                  rol, así que en el preview es **el campo por el que se filtra**
                  — hoy filtra por `tab_ids`, que se recrean al publicar.
                examples: ['overview']
              operational_question: { type: string }
              sort_order: { type: integer }
              icon: { type: string, examples: [''] }
              chat_suggestions:
                type: array
                description: '**Lista, nunca `null`** · igual que en el cable de consola.'
                items: { type: string }
              panels:
                type: array
                description: |
                  **Los paneles COMO LOS VERÍA ESE ROL** · B4.9, medido el
                  2026-09-28.

                  Ya vienen filtrados por `hidden_metric_ids` y con los
                  `layout_overrides` aplicados —posición, `options`, `note`—, así
                  que el front **no filtra ni recompone nada**: dibuja.

                  Es la misma forma que `PanelDTO` del cable de consola, y el
                  mismo código las sirve.
                items:
                  type: object
                  required: [id, metric_id, type, col_start, col_span, row_span, note, chart]
                  properties:
                    id: { type: string, format: uuid }
                    metric_id: { type: string, format: uuid }
                    type: { type: string, examples: [kpi, series, bars] }
                    col_start: { type: integer }
                    col_span: { type: integer, examples: [4, 12] }
                    row_span: { type: integer }
                    options: { type: object, additionalProperties: true }
                    note: { type: string }
                    chart:
                      type: string
                      description: |
                        **El gráfico, igual que en el cable de consola** · llegó
                        en `f70cec2`. Cadena vacía = el de por defecto del
                        bloque, y así salen los doce publicados.

                        Importa que esté acá y no sólo en la consola: **la vista
                        previa por rol tiene que dibujar lo mismo que el rol va a
                        ver**, y si el preview no trajera el gráfico mostraría
                        una cascada como dona y nadie lo notaría.
                      examples: ['', waterfall]

    AgentAdmin:
      type: object
      description: |
        `ports.AgentAdminDTO` · el agente visto desde administración.

        **Tres de estos campos no se pintan nunca**, y no es un olvido:
        `snowflake_db`, `snowflake_schema` y `warehouse` son vocabulario de
        infraestructura, que §7.3 de `design.md` prohíbe en esta superficie —
        «se declara la consecuencia, no la plomería».

        **Y el campo que §7.3 SÍ pide no existe:** «acceso vigente, última
        verificación». `is_active` no lo es y `updated_at` tampoco: uno es un
        interruptor y el otro dice cuándo se editó la fila.
      required: [id, tenant_id, name, target_role, snowflake_db, snowflake_schema, snowflake_cortex_agent_name, warehouse, semantic_views, system_prompt_base, is_active, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        target_role:
          type: string
          description: |
            El rol de PRODUCTO que atiende este agente —«Planner», «CEO»—, no un
            rol técnico de Snowflake. Sale de `roles.name`.
        snowflake_db: { type: string, description: 'No se pinta · §7.3.' }
        snowflake_schema: { type: string, description: 'No se pinta · §7.3.' }
        snowflake_cortex_agent_name: { type: string }
        warehouse: { type: string, description: 'No se pinta · §7.3.' }
        semantic_views:
          type: array
          items: { type: string }
          description: |
            Las vistas que el agente puede consultar. **Nombres de objeto de
            Snowflake**, así que tampoco se pintan crudos.
        system_prompt_base: { type: string }
        is_active:
          type: boolean
          description: |
            **Baja lógica, no verificación de acceso.** Un agente activo puede
            tener la credencial vencida y este campo seguiría en `true`.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
