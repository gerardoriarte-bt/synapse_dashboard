                      data: { $ref: '#/components/schemas/LayoutVersion' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ── B4.2 · la reversión · MEDIDA EN SUS COMPUERTAS · 2026-09-28 ───────────
  /admin/layouts/{layoutId}/revert:
    post:
      tags: [admin]
      operationId: revertLayout
      x-verificado-en: de881e1
      summary: Volver a una versión anterior
      description: |
        **B4.2 · llegó con `5924bf2b`.** Toma la versión destino —`to_layout_id`,
        o por defecto el `previous_layout_id` de la última publicación—, **copia**
        sus pestañas y paneles a un draft nuevo, lo valida contra el catálogo
        actual y lo publica.

        **Nunca se reactiva una versión archivada**, y es la decisión que hace
        auditable el historial: la versión a la que se volvió sigue `archived`, y
        en `GET /admin/layouts/{id}/publications` la vuelta aparece como una
        publicación más con `action: "rollback"`, su actor y su
        `previous_layout_id`.

        Por eso también **puede fallar con 422**: una versión vieja puede ya no
        validar contra el catálogo de hoy.

        ── **LO QUE SE MIDIÓ Y LO QUE NO** ────────────────────────────────────

        **Medidas, las dos compuertas**, sobre un tenant con un solo layout — que
        es justo lo que deja probarlas sin tocar nada:

            POST …/revert  {}                    → 409 CONFLICT_NO_PREVIOUS
            POST …/revert  {to_layout_id: él}    → 409 CONFLICT_REVERT_SELF

        Las dos con mensaje redactado y **en español**, que es lo que muestra que
        los dos mensajes en inglés del cable de consola son handlers sueltos y no
        una política.

        **NO medida, la reversión en sí**: copia y publica, así que cambiaría el
        layout que la consola está sirviendo. El `200` de abajo sale de su
        documento y no de una respuesta vista — se mide cuando haya una segunda
        versión que no sea la de nadie.
      parameters: [{ $ref: '#/components/parameters/layoutId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                to_layout_id:
                  type: string
                  format: uuid
                  description: |
                    A qué versión volver. **Sin esto se usa el
                    `previous_layout_id` de la última publicación**, y si no hay
                    da `409 CONFLICT_NO_PREVIOUS`.
                version_id:
                  type: string
                  description: |
                    El nombre de la versión nueva. Por defecto
                    `rollback-<versión copiada>`.
                  examples: ['rollback-v1']
      responses:
        '200':
          description: 'La versión nueva, ya publicada · **no medida**'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LayoutVersion' }
        '404':
          description: |
            `NOT_FOUND_LAYOUT` — el `{layoutId}` del path no existe ·
            `NOT_FOUND_REVERT_TARGET` — el destino no existe o es de otro
            dashboard.
        '409':
          description: |
            **Los cinco, releídos uno por uno el 2026-09-30** en
            `internal/core/services/dd_layout_builder_service.go` contra
            `de881e1`. Faltaban dos: el cable declaraba tres.

            `CONFLICT_NO_DASHBOARD` — el layout no cuelga de ningún dashboard,
            así que no hay historial contra el que revertir · `CONFLICT_NO_PREVIOUS`
            — no hay a qué volver y no mandaron destino · **medido** ·
            `CONFLICT_REVERT_SELF` — el destino es este mismo layout · **medido** ·
            `CONFLICT_REVERT_TO_DRAFT` — el destino es un borrador ·
            `CONFLICT_REVERT_EMPTY` — el destino no tiene pestañas.
        '422':
          description: '`VALIDATION_REVERT_TARGET` — la versión vieja ya no valida contra el catálogo actual'

  # ── B6 · EL HISTORIAL DE VERSIONES · MEDIDO EL 2026-09-30 ─────────────────
  #
  # **Dos rutas, y la que la pantalla necesita es la segunda.** No son dos formas
  # de pedir lo mismo: el filtro es distinto y se leyó en el repositorio
  # —`internal/adapters/repository/dd_layout_publication_repository.go`—, no
  # deducido del nombre.
  #
  #   ListByLayout     WHERE layout_id = ? OR previous_layout_id = ?   sin límite
  #   ListByDashboard  WHERE dashboard_id = ?                          LIMIT
  #
  # Por eso el mismo layout devolvió **una** fila y su dashboard **cinco**: la
  # primera es «dónde participó ESTA versión», la segunda es el historial.
  #
  # **Y un dashboard con un layout publicado puede devolver CERO filas**: medido
  # en «Overview», que tiene su `v1` publicado. La auditoría se empezó a escribir
  # con `168a761`; lo publicado antes no dejó fila. Un historial vacío no es un
  # error ni un dashboard sin publicar.
  /admin/layouts/{layoutId}/publications:
    x-verificado-en: de881e1
    get:
      tags: [admin]
      operationId: listLayoutPublications
      summary: Dónde participó esta versión · publicada o reemplazada
      description: |
        Las publicaciones **en las que este layout aparece de los dos lados**:
        como el que se publicó (`layout_id`) o como el que fue reemplazado
        (`previous_layout_id`). No es el historial del dashboard — para eso está
        `GET /admin/dashboards/{dashboardId}/publications`.

        Más recientes primero, y **sin límite ni paginación**.

        Medido el 2026-09-30 contra `:4010`: `16009187-…` → una fila,
        `f998ae8c-…` → `{"success":true,"data":[]}`.
      parameters: [{ $ref: '#/components/parameters/layoutId' }]
      responses:
        '200':
          description: Publicaciones, más recientes primero · puede ser vacío
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LayoutPublication' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`NOT_FOUND_LAYOUT` — el layout no existe'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/dashboards/{dashboardId}/publications:
    x-verificado-en: de881e1
    get:
      tags: [admin]
      operationId: listDashboardPublications
      summary: El historial de publicaciones del dashboard · §PEN:B6
      description: |
        **Es la fuente de B6.** Todas las publicaciones y reversiones del
        dashboard, más recientes primero.

        Medido el 2026-09-30 contra `:4010`, dashboard «Marca» → cinco filas:
        dos `publish` del 29, una `rollback` y dos `publish` del 28. La más vieja
        **no trae `previous_layout_id`**, que es la primera publicación.

        **El `limit` se acota en el repositorio, no en el handler**: `<= 0` o
        `> 200` vuelven a **50**. Así que pedir `limit=500` no da 400: da 50.
      parameters:
        - { $ref: '#/components/parameters/dashboardId' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 200 }
          description: |
            Cuántas filas. Fuera de `1..200` el servicio usa 50 **en silencio**.
      responses:
        '200':
          description: |
            Publicaciones, más recientes primero · **puede ser vacío con un
            layout publicado**, si se publicó antes de que existiera la auditoría
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LayoutPublication' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`NOT_FOUND_DASHBOARD` — el dashboard no existe'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ── B5.1 · los dashboards del tenant · DE DÓNDE SALE EL NOMBRE ────────────
  #
  # El **GET está medido**. El `POST` se transcribe **leído y NO corrido**, con
  # la misma honestidad que el 200 del revert: se declara qué falta medir en vez
  # de callarlo.
  #
  # **Y la razón de no correrlo es concreta: no hay DELETE de dashboard** —su
  # router tiene GET, POST y PUT y nada más—, así que medirlo deja un dashboard
  # de prueba para siempre en una base que el resto del trabajo lee, y `is_default`
  # **demota al anterior en la misma transacción** (`clearDefaultDashboard`). No
  # es descartable como un rol descartable.
