        `internal/adapters/repository/dd_dashboard_repository.go:23-35`.

        Responde **201**, como `createDraft`.

        Lo que el servicio decide y el cuerpo no dice:

        · **`slug` se deriva del `name`** si no viene —`slugify`: minúsculas, sin
