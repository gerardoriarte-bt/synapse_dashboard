openapi: 3.1.0

# ─────────────────────────────────────────────────────────────────────────────
# Synapse · EL CABLE de la consola
#
# ⚠ ESTO NO ES UN CONTRATO FIRMADO. Es una TRANSCRIPCIÓN escrita por el equipo
# de front leyendo el código de Go, porque el servicio todavía no publica un
# spec de estas rutas.
#
#   Transcrito el 2026-09-14 desde `AntPack-dev/synapse-api-go`
#   rama   feature/dynamic-dashboard-backend
#   commit 733c13c37dd54b9705e714cbc4718d8aa498092b  (2026-09-11)
#
# ── LA VERIFICACIÓN ES POR RUTA, DESDE EL 2026-09-25 ─────────────────────────
#
# Cada ruta declara `x-verificado-en` con el commit contra el que se leyó. La
# línea `commit` de arriba es la procedencia del archivo; `x-verificado-en` es
# lo que `backend-drift` mira.
#
# **Antes era una sola línea, y eso tuvo un costo medido.** Al reverificar tres
# rutas contra `82da946` la línea no se podía mover —habría dicho que las nueve
# estaban al día— así que se dejó en `733c13c` y el chequeo quedó **rojo
# permanente**. Ocho días después seguía sonando, ya como paisaje, mientras el
# backend agregaba siete formas de valor que nadie miró: el 2026-09-25 se les
# mandó un mensaje afirmando que no las tenían.
#
# El chequeo no falló. Lo que falló es que sólo sabía decir «sí» o «no» sobre un
# archivo que se verifica de a pedazos, así que la única forma de ponerlo en
# verde era mentir. Con la marca por ruta el número baja a medida que se
# reverifica, y un rojo que se mueve se sigue leyendo.
#
# Archivos leídos, y son la autoridad si esto difiere:
#   internal/core/ports/dd_config_service.go      los DTO de las rutas de config
#   internal/core/services/dd_config_service.go   estados, gobierno, períodos
#   internal/core/dashboard/blocks.go             BlockRule
#   internal/core/domain/dd_catalog_metric.go     la métrica, con sus json tags
#   internal/core/domain/dd_panel_data.go         las cinco constantes de estado
#   internal/core/dashboard/materialize/          las nueve formas de `value`
#   internal/adapters/handler/response.go         el envelope
#   internal/adapters/handler/router.go           las rutas y sus middlewares
#
# ── POR QUÉ EXISTE ESTE ARCHIVO ──────────────────────────────────────────────
#
# `contracts/synapse-api.yaml` declara lo que el PRODUCTO necesita. Este declara
# lo que el SERVICIO manda hoy. No coinciden, y la diferencia la absorbe
# `src/api/adapt.ts` — el contrato sigue siendo la forma interna del front.
#
# Se escribe acá y no se tipa a mano contra el servicio por una razón con
# antecedente: la primera versión del cliente de acceso se escribió leyendo
# estructuras de Go y ya costó un error. Con el yaml, `console-drift` verifica
# que los tipos no deriven de lo que dice este archivo.
#
# ── CUÁNDO SE BORRA ──────────────────────────────────────────────────────────
#
# Cuando el backend cierre su B0.7 —«extender el contrato con los 6 endpoints de
# consola»— y su binario publique estas rutas en el OpenAPI que ya embebe. Ese
# día este archivo se REEMPLAZA por el suyo y no cambia nada más: el adaptador
# tipa contra `src/api/console-generated.ts`, que se genera de acá.
#
# ── LO QUE NO ESTÁ ───────────────────────────────────────────────────────────
#
# `/config/decisiones`, `/config/accionables` y `/config/solicitudes` NO existen
# en el servicio. No se transcriben: declarar una ruta que nadie sirve es el
# mismo problema que un chequeo que pasa porque no encontró nada.
#
# `/config/chat`, `/config/chat/threads` y
# `/config/panels/{panelId}/chat-suggestions` SÍ existen y están transcritas
# abajo. **Acá decía que las dos últimas «no se transcriben todavía»**, y dejó de
# ser cierto cuando F3.7 las usó.
#
# `/config/chat/threads/{id}/messages` sigue SIN transcribir, y sus dos hermanas
# de la Fase 5 —`/config/panels/{panelId}/drilldown` y `.../dimensions`—
# tampoco: una ruta transcrita que nadie llama envejece sin que nadie lo note. Su
# spec las tiene, así que son doce contra las nueve de acá.
# ─────────────────────────────────────────────────────────────────────────────

info:
  title: Synapse · el cable de la consola
  version: 0.1.0-transcripcion
  description: |
    Las rutas `/config/*` que sirve `synapse-api-go`, tal como las sirve.

    **El conteo no se escribe acá.** `humo` exige que cada ruta esté en
    `MEDIDAS` o en `SALTADAS` con su razón, y lo informa al correr.

    **Nombres en inglés snake_case**, que es la convención del servicio. No se
    traducen acá: este archivo describe el cable. La traducción al vocabulario
    del contrato ocurre una sola vez, en `src/api/adapt.ts`.

servers:
  - url: /api/v1

security:
  - bearer: []

tags:
  - name: config
    description: Namespace `/config/*` · middleware JWT · el mismo binario que `/auth/*`.

paths:
  /config/me:
    x-verificado-en: de881e1
    get:
      tags: [config]
      operationId: getMe
      summary: Contexto del usuario del token
      description: |
        `DDConfigHandler.GetMe`. Las tabs salen del layout publicado del tenant,
        filtradas por `roles.tab_ids`. El filtrado por rol lo hace el servidor.
      responses:
        '200':
          description: Contexto
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ContextResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /config/catalog:
    x-verificado-en: de881e1
    get:
      tags: [config]
      operationId: getCatalog
      summary: Métricas del tenant, filtradas por rol
      description: |
        `data` es un **arreglo desnudo**, no `{ metrics: [...] }`. Sale de
        `SendSuccess(c, 200, metrics)` con `[]domain.DDCatalogMetric`.
      responses:
        '200':
          description: Catálogo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CatalogMetric' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /config/blocks:
    x-verificado-en: de881e1
    get:
      tags: [config]
      operationId: getBlocks
      summary: La tabla tipo ↔ formas ↔ rangos de span
      description: |
        Catálogo GLOBAL, no por tenant. Sale de la tabla `blocks`. `data` también
        es un arreglo desnudo.
      responses:
        '200':
          description: Reglas de bloque
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/BlockRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /config/plots:
    x-verificado-en: b6f0e09
    get:
      tags: [config]
      operationId: getPlots
      summary: El repertorio de gráficos, con sus mínimos y sus topes
      description: |
        **B1.21 · LA ESCRIBIMOS NOSOTROS** · `b6f0e09` en
        `feature/config-plots` del fork, medida el 2026-09-29: **200 con 49
        entradas en 5 ms**. Estuvo pedida tres veces y no llegaba; la tabla era
        nuestra entera, así que lo que faltaba era la ruta.

        Catálogo **GLOBAL, no por tenant** —qué puede dibujar un gráfico no
        depende del cliente— y `data` es un **arreglo desnudo**, igual que
        `blocks`. Eso último fue una decisión al escribirla: envolverlo en
        `{"plots": [...]}` era más prolijo y obligaba a un segundo adaptador
        para dos rutas que son la misma cosa.

        Las 49 filas están **generadas y no transcritas** —`tools/gen-plots.py`,
        desde el repertorio de v2, el `.pen`, la decisión de los mínimos y el
        mapa de formas del adaptador—. Pedirle al backend transcribir 49 filas
        de una tabla markdown era el modo de falla que ya costó quince filas mal
        en otra tabla.
      responses:
        '200':
          description: El repertorio entero, en el orden de §5
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PlotRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /config/tabs/{tabId}:
    x-verificado-en: de881e1
    get:
      tags: [config]
      operationId: getTab
      summary: La composición de una pestaña, sin datos
      description: |
        Paneles filtrados por `roles.hidden_metric_ids` y con
        `roles.layout_overrides` ya aplicados. Un `tabId` que no pertenece al
        tenant devuelve **404**, no 403.
      parameters:
        - name: tabId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: layoutId
          in: query
          required: false
          description: |
            Sin él, el layout publicado del tenant. Con él, valida que el layout
            sea del tenant y que la tab sea de ese layout — permite borradores.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Pestaña con paneles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TabWithPanels' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /config/panels:batch:
    x-verificado-en: de881e1
    post:
      tags: [config]
      operationId: batchPanels
      summary: Los payloads de varios paneles en una llamada
      description: |
        **Los dos campos del body son `required` en el binding de Gin**, así que
        un nombre equivocado devuelve 400 y no un batch vacío. `panel_ids` pide
        `min=1`.

        Lee `dd_panel_data`, nunca Snowflake. La clave del mapa de respuesta es
        el `panel_id` en texto.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchRequest' }
      responses:
        '200':
          description: Mapa panelId → payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: { $ref: '#/components/schemas/Payload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /config/me/preferences:
    x-verificado-en: de881e1
    put:
      tags: [config]
      operationId: updatePreferences
      summary: Persistir el tema del usuario
      description: |
        Escribe `users.theme`. **Y desde el 2026-09-26 SÍ se puede leer**:
        `/config/me` devuelve `user.theme` (B1.1). Acá decía «no hay ruta para
        leerlo, la preferencia se guarda y no se puede recuperar», que era cierto
        cuando se transcribió y dejó de serlo sin que nada avisara — el chequeo
        sólo miraba los campos que el yaml exige, no los que el servicio agrega.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [theme]
              properties:
                theme: { type: string, enum: [dark, light] }
                # **Nuevo, reverificado contra `75b8ecc` el 2026-09-25.** Llegó
                # con la Fase 5 del backend y estuvo sin transcribir desde
                # `168a761`: el cable declaraba `733c13c` para esta ruta.
                #
                # Es la preferencia que gana en la resolución del dashboard
                # activo —**preferencia > rol > default del tenant**, lo declara
                # `DDContextResponse`— así que es la mitad que escribe lo que
                # `active_dashboard_id` devuelve.
                preferred_dashboard_id:
                  type: [string, 'null']
                  format: uuid
                  description: |
                    `null` limpia la preferencia y vuelve a la resolución por
                    rol. Ausente la deja como está.
      responses:
        '200':
          description: El tema guardado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        # **El handler ECO lo que recibió** — `gin.H{"theme":
                        # req.Theme, "preferred_dashboard_id":
                        # req.PreferredDashboardID}` — así que la respuesta trae
                        # los dos campos del pedido y no el estado guardado.
                        # `preferred_dashboard_id` faltaba acá desde el 25:
                        # estaba transcrito en el `requestBody` y no en la
                        # respuesta, y nada comparaba las dos.
                        required: [theme, preferred_dashboard_id]
                        properties:
                          theme: { type: string, enum: [dark, light] }
                          preferred_dashboard_id:
                            type: [string, 'null']
                            format: uuid
                            description: |
                              **`null` cuando el pedido no lo mandó**, porque es
                              un puntero sin `omitempty`: el eco no distingue
                              «no lo pedí» de «lo limpié».
        '400': { $ref: '#/components/responses/BadRequest' }

  # ── B3.1 · el chat contextual · TRANSCRITO DE 82da946 ────────────────────
  /config/chat:
    # **Reverificada POR LECTURA, no por medición** · 2026-09-26 · `8633b10`.
    # Las otras ocho se midieron pidiéndoselas al servicio; ésta no: `humo` la
    # saltea porque es SSE, cuesta una llamada a Cortex y escribe un hilo.
    #
    # La base es que su forma **no cambió**: entre `75b8ecc` y `8633b10` los seis
    # archivos que emiten sus tramas —`ports/dd_chat_service.go`,
    # `cortex_chat.go`, `cortex_client.go`, `cortex_sse.go`,
    # `handler/dd_chat_handler.go` y `services/dd_config_service.go`— salen «sin
    # cambios» salvo el último, y de él **ninguna línea del diff menciona chat,
    # thread, sse, delta ni thinking**.
    #
    # Los seis se enumeraron a mano a propósito: `git diff -- '*chat*'` decía
    # «dos archivos» y **se perdía tres**, porque `cortex_sse.go` y
    # `cortex_client.go` no tienen «chat» en el nombre. Es la misma clase de
    # error que `grep "case \""` el 2026-09-25.
    #
    # **Las seis formas `ChatFrame*` siguen sin verse contra el servicio.** Eso
    # es cobertura que falta, y queda dicho acá y en la salida de `humo`.
    x-verificado-en: de881e1
    post:
      tags: [config]
      operationId: askChat
      summary: Preguntar desde un panel · stream SSE
      x-origen: 82da946
      description: |
        **Transcrita el 2026-09-21 desde `82da946`**, no desde `733c13c` como el
        resto de este archivo: la ruta no existía cuando se transcribió lo demás.
        Leído `internal/adapters/handler/dd_chat_handler.go` (el handler),
        `internal/core/services/dd_chat_service.go` (`pump`, que arma los frames)
        y `internal/core/services/cortex_sse.go` (los siete nombres de evento).

        **La respuesta NO es JSON: es `text/event-stream`**, y cada trama lleva
        DOS líneas — `event: <nombre>` y `data: <json>`. **El discriminador está
        en la línea `event:`**, no adentro del JSON, que es lo contrario de lo
        que declara `EventoDeChat` del contrato. Por eso hay traducción en
        `src/api/chat.ts` y no un `JSON.parse` a secas.

        `panel_context` es `binding:"required"` con `panel_id` `uuid`: sin
        contexto de panel la llamada devuelve 400. No hay chat sin panel.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatAskRequest' }
      responses:
        '200':
          description: |
            El stream. El esquema es `string` porque OpenAPI no describe tramas
            SSE; las formas de cada `data:` están en los `ChatFrame*` de
            `components/schemas`, que existen para que el traductor tipe contra
            algo y no contra structs de Go leídos a mano.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El rol no ve el tab o la métrica del panel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: No hay agente activo para el tenant y el rol
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: |
            Rate limit por usuario, compartido con `/chat/*`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ── F3.7 · el historial de hilos · TRANSCRITO DE 82da946 ─────────────────
  /config/chat/threads:
    x-verificado-en: de881e1
    get:
      tags: [config]
      operationId: listChatThreads
      summary: Los hilos del usuario, con el panel del que salieron
      x-origen: 82da946
      description: |
        **Transcrita el 2026-09-21 desde `82da946`**, leyendo
        `internal/core/ports/dd_chat_service.go` —`DDChatThreadDTO`— y
        `internal/adapters/handler/dd_chat_handler.go` —`ListThreads`—.

        **Devuelve un ARREGLO DESNUDO dentro del envelope**, no un objeto con
        una clave: `SendSuccess(c, http.StatusOK, threads)`.

        **Trae los DOS ids, y no son intercambiables** — ver `ChatThread`.
      parameters:
        - name: panel_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: |
            Filtra a los hilos abiertos desde ese panel. Es lo que permite que
            la hoja de un panel muestre sus propias conversaciones.
        - name: tab_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: |
            **Nuevo · reverificado contra `75b8ecc` el 2026-09-25.** El par del
            `tab_context` de `POST /config/chat`: con el chat presente en la
            pestaña, el riel tiene que poder mostrar los hilos de esa pestaña y
            no los de un panel · F3.15.
        - name: period
          in: query
          required: false
          schema: { type: string, examples: ['2026-09'] }
          description: |
            `YYYY-MM`. Otro formato devuelve **400**, no una lista vacía.
        - name: limit
          in: query
          required: false
          schema: { type: integer }
          description: |
            Sin valor, o `<= 0`, el servicio usa **50**; por encima de **200**
            lo recorta. Lo hace `clampLimit`.
      responses:
        '200':
          description: Los hilos, del más reciente al más viejo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ChatThread' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── B3.2 · las preguntas sugeridas · TRANSCRITO DE 82da946 ───────────────
  /config/panels/{panelId}/chat-suggestions:
    x-verificado-en: de881e1
    get:
      tags: [config]
      operationId: panelChatSuggestions
      summary: Qué preguntar sobre este panel
      x-origen: 82da946
      description: |
        **Transcrita el 2026-09-21 desde `82da946`**, leyendo
        `internal/core/services/dd_chat_suggestions.go` y el handler
        `DDChatHandler.Suggestions`.

        **Determinista y sin Cortex**: las arma `SuggestQuestions` con el
        contexto del panel —su forma, su estado y su valor—, así que **no
        gasta la cuota del agente** y no puede tardar.

        **Cambian con el ESTADO del panel.** Un panel sin datos sugiere «¿Qué
        falta para que … tenga datos?»; uno con cifra sugiere por qué está en
        ese nivel, cómo se compara y qué la impulsa. Son entre 1 y 4.

        **Sin `period` el servicio usa el mes actual en UTC**, que no es el del
        tenant. El front lo manda siempre: es el período que se está mirando.
      parameters:
        - name: panelId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: period
          in: query
          required: false
          schema: { type: string, examples: ['2026-09'] }
          description: '`YYYY-MM`. Otro formato devuelve 400.'
      responses:
        '200':
          description: Entre una y cuatro preguntas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        maxItems: 4
                        items: { $ref: '#/components/schemas/ChatSuggestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El rol no ve el tab o la métrica del panel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Request mal formado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Token ausente, inválido, o sin `role_id` en los claims
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: No existe, o no es de este tenant
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServerError:
      description: Falla interna
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    Envelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean, enum: [true] }

    ErrorResponse:
      type: object
      description: |
        **`error` es una CADENA, no un objeto.** `handler/response.go`:

            type Response struct {
                Success bool        `json:"success"`
                Data    interface{} `json:"data,omitempty"`
                Error   string      `json:"error,omitempty"`
            }

        No es el envelope de §4.1 del contrato, que declara
        `{ codigo, mensaje, campo, desbloqueaCon }`. Leer esta cadena como objeto
        da `code: undefined` y `message: ""` — una pantalla de error sin una
        palabra. Es el mismo defecto por el que existe `api/auth.ts`.
      required: [success, error, code]
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: string
          description: |
            **El mensaje, y NO siempre en español** · remedido el 2026-09-28
            contra `5924bf2b`.

            Su respuesta de ese día dice que «`error` sigue siendo el mensaje en
            español de siempre». **No lo es**, y este campo ya lo tenía
            transcripto desde antes: los dos ejemplos de abajo son literales
            medidos.

            **No es una política, son handlers sueltos**: los errores del revert
            salen redactados y en español —«el layout no tiene una versión
            anterior a la que volver; indique to_layout_id»—.

            **Y esto llega a la pantalla tal cual.** `client.ts` lo pasa sin
            tocarlo —redactar el error del servidor sería el front inventando— y
            `ErrorState` lo pinta como `phrase`. Un usuario puede ver el nombre
            de un struct de Go y el tag de un validador. Va pedido.
          examples: ['tab not found', 'invalid request: Key: ''DDBatchRequest.PanelIDs'' Error:Field validation for ''PanelIDs'' failed on the ''required'' tag']
        code:
          type: string
          description: |
            **B0.4 · llegó el 2026-09-28**, y es lo que hace accionable un error.

            Forma: `FAMILIA_DETALLE`. **Se decide por la FAMILIA** —el prefijo
            hasta el primer `_`—: ellos suman detalles sin avisar, así que un
            `switch` sobre el valor entero se rompe solo.

            Familias: `VALIDATION` (400/422), `AUTH` (401/403), `NOT_FOUND`
            (404), `CONFLICT` (409), `RATE_LIMIT` (429), `INTERNAL` (5xx).

            **Medido en cuatro**, una llamada por familia: `AUTH_UNAUTHORIZED`
            sin token, `NOT_FOUND_RESOURCE` con una pestaña inexistente,
            `AUTH_FORBIDDEN` pegándole a `/admin/*` con token de planner, y
            `VALIDATION_REQUEST` mandando `theme: "morado"`.

            Si una ruta no fija un detalle propio sale el genérico de su familia.
          examples: [AUTH_UNAUTHORIZED, NOT_FOUND_RESOURCE, AUTH_FORBIDDEN, VALIDATION_REQUEST, CONFLICT_NOT_DRAFT]

    # ── /config/me ───────────────────────────────────────────────────────────

    ContextResponse:
      type: object
      description: |
        `ports.DDContextResponse`.

        ── **B1.1 LLEGÓ A MEDIAS** · medido campo por campo el 2026-09-28 contra
        `5924bf2b` ────────────────────────────────────────────────────────────

        El pedido tenía seis cosas. **Llegaron tres** —`scope` con sus tenants,
        el grano de cada período, y `icon`/`chat_suggestions` en la pestaña— y
        por eso B1.1 **sigue en ⚠️**: cerrarla sería el defecto de «el criterio
        se cumple a medias y nadie lo bajó».

        **Lo que sigue faltando**, medido sobre la respuesta real: `tenant`
        trae `id`, `name`, `locale`, `currency` y `timezone` —no `etiqueta`—;
        `role` trae `id` y `name` —no `puedeAprobar`—; `user` trae `id`,
        `email`, nombre y `theme` —no `capacidades`—; y la pestaña no trae
        `key`.

        **`tenant.vertical` salió del pedido y no es un olvido**: §3.5 declara
        `vertical` **y** `plantillaOrigen`, y ese mecanismo no existe de ninguno
        de los dos lados · `docs/DECISIONES-2026-09-28-estado-y-vertical.md`.
      required: [user, tenant, role, tabs, periods, catalog_version, period_grain, periods_detail, scope]
      properties:
        user: { $ref: '#/components/schemas/UserInfo' }
        tenant: { $ref: '#/components/schemas/TenantInfo' }
        role: { $ref: '#/components/schemas/RoleInfo' }
        tabs:
          type: ['array', 'null']
          description: |
            ── **PUEDE SER `null`, Y SE MIDIÓ ROMPIENDO LA CONSOLA** · 2026-09-26

            Estaba declarado `array` a secas y está en `required`, así que el
            adaptador hacía `w.tabs.map(...)` sin mirar. **Un dashboard sin
            layout publicado devuelve `tabs: null`** —no `[]`— y ahí el
            adaptador tira.

            Se encontró al crear un segundo dashboard para poder verificar F5.1:
            `POST /admin/tenants/{tenantId}/dashboards` deja crearlo sin layout,
            que es el estado normal de uno recién creado. Con la preferencia
            apuntada ahí, la consola muestra «No se pudo cargar tu contexto ·
            sin detalle del servidor» — y el fallo era nuestro.

            **Sigue en `required`**: la clave viaja siempre, lo que cambia es
            que su valor puede ser nulo.
          items: { $ref: '#/components/schemas/TabMeta' }
        periods:
          type: array
          description: |
            **Cadenas sueltas, no objetos.** `availablePeriods()` devuelve los
            últimos doce meses del CALENDARIO contando desde `time.Now()`, tenga
            o no tenga materialización. No traen etiqueta, rango, estado ni
            grano.
          items: { type: string, examples: ['2026-09'] }
        open_period:
          type: string
          x-origen: fork
          description: |
            **Cuál de los doce está EN CURSO**, o sea incompleto. El resto están
            cerrados.

            **Es del fork** —lo escribimos nosotros en `2fafe82`, B1.27— y
            `82da946` no lo trae: contra el servicio desplegado este campo **no
            llega**, y el selector se comporta como antes. Medido el 2026-09-22
            levantando upstream limpio al lado.

            Sin él, el mes en curso se ofrece igual que los cerrados y alguien
            compara septiembre con nueve días contra agosto entero y lee una
            caída que es «el mes todavía no terminó» · F1.42.

            **No se deduce contra `new Date()`**: el corte del día es del tenant
            y su huso, no del navegador · la regla de las dos zonas horarias.
          examples: ['2026-09']

        # ── MULTI-DASHBOARD · reverificado contra `75b8ecc` el 2026-09-25 ────
        #
        # **Tres campos que el cable no tenía.** Llegaron con la Fase 5 del
        # backend y estuvieron sin transcribir desde `168a761` (2026-09-21):
        # el cable declaraba `733c13c` para esta ruta y nadie la releyó.
        #
        # **Esto es lo que F5.1 esperaba.** Su candado dice «`Contexto` no
        # declara `layouts`», y ahora declara `dashboards` con su
        # `active_layout_id` resuelto. Queda anotado y **no se toma**: un
        # candado vencido se dice y se pregunta.
        dashboards:
          type: array
          description: |
            Los dashboards que el rol ve. **Con más de uno, la consola necesita
            un selector** · F5.1.
          items:
            type: object
            required: [id, name, slug, is_default]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              slug: { type: string }
              is_default: { type: boolean }
        active_dashboard_id:
          type: string
          format: uuid
          description: |
            El resuelto, y el orden de resolución lo declara su comentario:
            **preferencia del usuario > rol > default del tenant**. Ausente si
            no hay ninguno.
        active_layout_id:
          type: ['string', 'null']
          format: uuid
          description: |
            El layout del dashboard activo. **`null` cuando ese dashboard no
            tiene layout publicado**, medido el 2026-09-26 contra un dashboard
            recién creado — y ahí `tabs` también viene `null`. Los dos juntos
            son el estado «existe pero no se compuso todavía».

        catalog_version: { type: integer }
        period_grain:
          type: string
          enum: [month, week]
          description: |
            El grano de **todos** los `periods` · B1.1 · medido `"month"`.

            `week` queda declarado para cuando exista dato semanal, y entonces
            `periods_detail[].grain` lo dirá por período. **Hoy no se emite**:
            está acá porque ellos lo declaran, no porque se haya visto.
        periods_detail:
          type: array
          description: |
            El mismo juego de `periods`, con sus bordes resueltos. `periods` no
            cambió: esto se suma al lado.

            **`[start, end)`** — el fin es exclusivo, y eso lo dice el dato
            medido: `2026-09` va de `2026-09-01` a `2026-10-01`.
          items:
            type: object
            required: [key, grain, start, end]
            properties:
              key: { type: string, examples: ['2026-09'] }
              grain: { type: string, enum: [month, week] }
              start: { type: string, format: date, examples: ['2026-09-01'] }
              end: { type: string, format: date, examples: ['2026-10-01'] }
        scope:
          type: object
          description: |
            Qué clientes ve este usuario · lo que el contrato llama `alcance` con
            `tenantsDisponibles`.

            **Medido con los dos usuarios de la base local**: con el token de
            `planner` sale `single_tenant` y un solo tenant; el selector de
            cliente del navbar sólo tiene sentido con `multi_tenant`.
          required: [kind, tenants]
          properties:
            kind:
              type: string
              enum: [single_tenant, multi_tenant]
            tenants:
              type: array
              description: '**Nunca `null`** · lo declaran ellos.'
              items:
                type: object
                required: [id, name, label]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string, examples: ['Under Armour México'] }
                  label:
                    type: string
                    description: |
                      **La forma corta, y acá es DONDE SE USA.** Llegó en
                      `f70cec2` junto a `tenant.label` y el cable la declaraba
                      sólo en el tenant activo — medido el 2026-09-28: el
                      servicio la manda también en cada entrada de `tenants`.

                      **El selector de cliente del navbar es el navbar**, que es
                      para lo que la forma corta existe. Mientras el adaptador
                      leyó `name` acá, el selector decía «UNDER ARMOUR MÉXICO»
                      con la cabecera al lado diciendo la corta: se vio abriendo
                      la aplicación, no en una prueba.

                      El servicio la hace caer a `name` cuando el tenant no la
                      define, así que se lee siempre y sin respaldo.
                    examples: ['UA México']

    UserInfo:
      type: object
      description: El nombre llega partido; el contrato lo pide junto.
      required: [id, email, first_name, last_name, theme]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        # **B1.1 · agregado el 2026-09-26, medido contra `8633b10`.** Hasta acá
        # la ruta de preferencias decía «no hay ruta para leerlo: `/config/me` no
        # lo devuelve», y esa frase quedó falsa: `DDUserInfo.Theme` existe y se
        # sirve para que la consola pinte bien desde el primer pixel.
        #
        # `string` pelado, sin `omitempty`: siempre viene, nunca `null`.
        theme:
          type: string
          enum: [light, dark]
          examples: [light]

    TenantInfo:
      type: object
      # **Las tres de F1.13b · agregadas el 2026-09-26, medidas contra `8633b10`.**
      # Llegaron con la migración que le puso `locale`, `currency` y `timezone` a
      # `tenants`, y son las que el front venía fijando a mano: `es-MX` escrito en
      # `FeedHealth`, `UserList` y `ConsoleContainer` con un comentario que decía
      # «el día que el campo exista se cambia una línea».
      #
      # **`timezone` es el del TENANT, no el del navegador**, y confundirlos es el
      # bug que `CLAUDE.md` describe: el corte del día del negocio sale de acá, la
      # presentación —«HACE 3 H», el agrupado del riel— sale del huso de quien
      # mira. Que se llamen distinto en nuestra capa es a propósito.
      #
      # Los tres son `string` sin `omitempty`: vienen siempre, y **vacío** —no
      # `null`— cuando el tenant no los tiene cargados.
      required: [id, name, locale, currency, timezone, label]
      properties:
        label:
          type: string
          description: |
            **La forma corta para el navbar** · pedida en B1.1 y llegó el
            2026-09-28. El `.pen` pinta `UA MX` donde mostrábamos
            `Under Armour México`.

            **Si el tenant no la define vale `name`**, y eso lo hacen ellos: «pueden
            pintar `label` siempre y olvidarse del fallback». Medido con el tenant
            local, que no la definió: `label` y `name` traen lo mismo.

            Sale también en cada `scope.tenants[].label`.
          examples: ['UA MX']
        id: { type: string, format: uuid }
        name: { type: string, examples: ['Under Armour México'] }
        locale:
          type: string
          description: |
            Etiqueta BCP 47. **El valor de hoy es el default de la migración, no
            el del cliente**: el tenant «Under Armour México» trae `es-CO` con
            `COP` y `America/Bogota`, medido el 2026-09-26. Se corrige con
            `PUT /admin/tenants/{tenantId}`, que también llegó en `8633b10` — es
            dato a cargar, no un defecto del campo.
          examples: ['es-CO', 'es-MX']
        currency:
          type: string
          description: Código ISO 4217.
          examples: ['COP', 'MXN']
        timezone:
          type: string
          description: |
            IANA. **Del tenant y uno solo**, aunque tenga tiendas en varios
            países: una cifra que cambia según quién la mira no es auditable.
          examples: ['America/Bogota', 'America/Mexico_City']

    RoleInfo:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: ['planner'] }

    TabMeta:
      type: object
      description: |
        ── **`icon` y `chat_suggestions` llegaron** · 2026-09-28, medidos contra
        `5924bf2b` ────────────────────────────────────────────────────────────

        Eran el pedido de **B4.4**, abierto desde el 2026-09-15 cuando F4.8
        construyó el editor de pestañas: el builder los podía escribir y la
        consola no los recibía.

        Entran por `PUT /admin/layouts/{id}` —se recortan, se descartan las
        vacías y **el máximo es 8**, más da `422 VALIDATION_CHAT_SUGGESTIONS`— y
        salen por acá.
      required: [id, name, operational_question, sort_order, icon, chat_suggestions, key]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        operational_question: { type: string }
        sort_order: { type: integer }
        key:
          type: string
          description: |
            **La identidad estable de la pestaña dentro del dashboard** · pedida
            en B1.1 desde el principio, y llegó el 2026-09-28 por una segunda
            razón que ellos levantaron.

            `roles.tab_ids` guarda ids de FILA, y las filas se recrean en cada
            versión publicada: **la primera publicación real desde el builder
            dejaba sin pestañas a todo rol con restricción**. La `key` sobrevive
            a las versiones, y la reversión la copia.

            Es un slug, única por versión de layout. Ausente en el builder se
            deriva del nombre —`Visión General` → `vision-general`—; repetida da
            `422 VALIDATION_TAB_KEY`. Las existentes se rellenaron en la
            migración: medido, la sembrada trae `overview`.
          examples: [overview, marca]
        icon:
          type: string
          description: |
            **Cadena vacía cuando no hay**, no `null` · medido. La semilla no
            trae ninguno, así que hoy llega `""` en las tres rutas que sirven
            `TabMeta`.
          examples: ['', 'box']
        chat_suggestions:
          type: array
          description: |
            **SIEMPRE lista, nunca `null`** · lo declaran ellos y se midió. Es lo
            que permite que el riel las recorra sin guardia — y la diferencia con
            `tabs`, que sí llega `null` en un dashboard sin componer.

            **No se confunden con las de panel**, que siguen viniendo de
            `GET /config/panels/{panelId}/chat-suggestions` y no cambiaron.
          items: { type: string }

    # ── /config/catalog ──────────────────────────────────────────────────────

    CatalogMetric:
      type: object
      description: |
        `domain.DDCatalogMetric`, serializado con sus etiquetas `json:`.

        **`shape`, `family` y `layer` son `string` libre en Go**, no enumerados.
        Los valores de abajo son los que el sistema sabe manejar; el servicio no
        impide otros, y `sync-catalog` hace upsert de lo que diga una vista de
        Snowflake. Cerrarlos es trabajo del adaptador · F1.35.

        Le faltan tres campos que el contrato declara: `estado`, `estadoRazon` y
        `notaLectura`. **Eran cuatro hasta el 2026-09-26**: `ventana` llegó como
        `measurement_window`, abajo.
      required:
        [id, tenant_id, key, name, shape, family, layer, source, base,
         min_grain, dimensions, catalog_version, measurement_window]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        key: { type: string, examples: ['revenue', 'platform_return'] }
        name: { type: string }
        shape:
          type: string
          description: |
            Las que `materialize.TransformValue` sabe transformar. **Son quince
            desde `168a761`** y este texto decía nueve, que era cierto al
            transcribirlo: `scalar`, `scalar_with_interval`, `categorical`,
            `ranking`, `time_series`, `multi_series`, `tabular`, `prose`,
            `composition`, `compared_categorical`, `multi_attribute_profile`,
            `matrix`, `graph`, `flow`, `distribution` y `series_with_band`.

            **El conteo viejo costó un mensaje equivocado al backend** el
            2026-09-25: se citó esta línea como si confirmara una medición
            nuestra, y era la misma lectura vieja escrita dos veces.

            `distribution` emite `{bins:[{label, v, lo?, hi?}]}`.

            **`series_with_band` es ESTRICTA desde `75b8ecc`**, el mismo día que
            se pidió: `{level, points:[{t, v, lo, hi}]}`, con `level` de nivel
            superior y `lo`/`hi` obligatorios por punto. Su transformer falla con
            `ErrMissingField` si falta cualquiera de los tres, así que lo que
            llega está completo o no llega — que es lo que deja al front aplicar
            «un pronóstico sin banda no se publica» sin tener que adivinar si es
            un intervalo faltante o una serie mal etiquetada.

            Reverificado contra `75b8ecc` el 2026-09-25.
          examples:
            - scalar
            - scalar_with_interval
            - time_series
            - multi_series
            - categorical
            - ranking
            - tabular
            - prose
            - composition
        family:
          type: string
          description: De acá sale el color de datos del front.
          examples: [demand, media, inventory, customer, external]
        layer: { type: string, examples: [BRONZE, SILVER, GOLD] }
        source: { type: string }
        base: { type: string }
        unit: { type: [string, 'null'] }
        semantic_direction:
          type: [string, 'null']
          description: |
            **LLEGAN LAS DOS FORMAS, Y EL FRONT LO PINTA CRUDO** · corregido el
            2026-09-26, medido contra `8633b10`.

            Acá decía «TEXTO que se pinta tal cual, no un código», con fecha y
            medición del 2026-09-14. **La medición era correcta y la conclusión
            no**: ese día el catálogo tenía sólo las doce métricas de la SEMILLA,
            y `dd_seed.go` escribe literal `HIGHER = BETTER`. Se generalizó de la
            semilla a Snowflake sin haber visto una fila de Snowflake.

            Contado el 2026-09-26 sobre las 18 métricas del tenant, después de
            que `sync-catalog` corriera:

              · `HIGHER_IS_BETTER`  6  ← de la vista `SYNAPSE_METRIC_CATALOG`
              · `HIGHER = BETTER`   8  ← de la semilla de Postgres
              · `null`              4

            **Y `PanelShell` lo pinta dentro de un `Label` sin mirarlo**, así que
            seis paneles muestran `HIGHER_IS_BETTER` con guiones bajos. No es un
            defecto nuestro: la regla es que el adaptador no escribe copy de
            producto, y el dueño de este texto es el catálogo.

            **Está pedido a DATOS**, y su propia vista de validación lo detecta:
            la séptima regla de `SYNAPSE_METRIC_CATALOG_ISSUES`. Hasta que las
            seis filas se retipeen, el front no lo traduce — traducir acá sería
            una tabla de equivalencias que nadie mantiene el día que el texto de
            origen cambie.
          examples: ['HIGHER = BETTER', 'HIGHER_IS_BETTER']
        min_grain: { type: string, examples: [day, week, month] }
        # ── B1.25 · agregado el 2026-09-26, medido contra `8633b10` ───────────
        #
        # El mismo campo que `Governance.measurement_window` y por la misma
        # razón, un nivel arriba: acá describe la métrica, allá viaja con el dato
        # del panel. Con valor en **10 de las 18**; las ocho vacías son de la
        # semilla, que la vista no tiene.
        measurement_window:
          type: string
          description: |
            Ventana **ya redactada**, de la columna `MEASUREMENT_WINDOW`.
            `string` sin `omitempty`: siempre viene, vacío si no hay.
          examples: ['Mes calendario seleccionado']
        dimensions:
          type: array
          items: { type: string }
        catalog_version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ── /config/blocks ───────────────────────────────────────────────────────

    PlotRule:
      type: object
      description: |
        Una entrada del repertorio · la tabla `plots`.

        **Las formas van en el idioma del CABLE** —`scalar`, `time_series`—,
        igual que `accepted_shapes` de `BlockRule`, y el adaptador las traduce
        con el mismo mapa.
      required: [id, name, shapes, supports_band, minimums]
      properties:
        id: { type: string, examples: ['donut', 'treemap'] }
        name:
          type: string
          description: |
            El título en mayúsculas, **transcripto del `.pen`** para los 43 que
            dibuja. Es copy de producto: lo pinta el selector del builder.
          examples: ['DONA', 'PARETO']
        shapes:
          type: array
          items: { type: string }
          description: Qué formas de dato sabe dibujar, en el idioma del cable.
        supports_band:
          type: boolean
          description: |
            Regla dura 6 · `series_with_band` sólo admite gráficos con esto en
            `true`. Un pronóstico sin banda no se publica.
        minimums:
          type: array
          description: |
            Cuántos datos necesita para no engañar, **por forma**.

            **Vacío es un valor legítimo y NUNCA llega `null`** · medido el
            2026-09-29: seis de los 49 salen `[]` y son exactamente los de
            `scalar` y `prose`. Vacío significa «no exige un mínimo» —una cifra
            es una cifra—, que es distinto de «no se sabe»; el servicio lo
            normaliza para que ningún consumidor tenga que distinguirlos.
          items:
            type: object
            required: [shape, when, reason]
            properties:
              shape: { type: string, examples: ['categorical'] }
              when:
                type: string
                description: La condición, legible y evaluable sobre el valor.
                examples: ['items < 2', 'puntos < 2', 'filas < 2 o columnas < 2']
              reason:
                type: string
                description: |
                  **Copy de producto, se pinta tal cual.** Viene redactada de
                  `design.md`; el front no la traduce ni la compone.
                examples: ['una barra sola no compara nada']
        cap:
          type: ['object', 'null']
          description: |
            El techo que lo deshabilita, con su razón. `null` cuando no tiene —
            medido: sólo cuatro de los 49 lo llevan.
          required: [when, reason]
          properties:
            when: { type: string, examples: ['partes > 5'] }
            reason: { type: string, examples: ['más de cinco partes, ilegible en dona'] }

    BlockRule:
      type: object
      description: |
        `dashboard.BlockRule`. Quince filas en la tabla `blocks`.
      required:
        [type, ui_name, accepted_shapes, col_span_min, col_span_max,
         row_span_min, row_span_max]
      properties:
        type:
          type: string
          examples: [kpi, prose, series, bars, table, gauge, forecast, list,
                     reco, composition, comparison, distribution, blocked,
                     matrix, graph]
        ui_name:
          type: string
          description: Etiqueta para la UI de admin. El contrato no la tiene.
        accepted_shapes:
          type: array
          description: |
            **`blocked` declara `["*"]`**, un comodín que el contrato no tiene.
            El adaptador lo expande o lo trata aparte.
          items: { type: string }
        col_span_min: { type: integer }
        col_span_max: { type: integer }
        row_span_min: { type: integer }
        row_span_max: { type: integer }
        layout_params:
          type: array
          description: |
            Los nombres de param válidos, **en inglés**: `maximum`, `horizon`,
            `order`, `cap`, `normalization`, `pillars`, `columns`, `band`,
            `cut`, `window`. El front los espera en español · F1.41.
          items: { type: string }

    # ── /config/tabs/{tabId} ─────────────────────────────────────────────────

    TabWithPanels:
      type: object
      required: [tab, panels]
      properties:
        tab: { $ref: '#/components/schemas/TabMeta' }
        panels:
          type: array
          items: { $ref: '#/components/schemas/PanelDTO' }

    PanelDTO:
      type: object
      description: |
        `ports.DDPanelDTO`. En la base la columna es `block_type`; acá el campo
        es `type`. Mapea limpio al `PanelConfigurado` del contrato.

        **`note` llegó el 2026-09-28** · B1.13 · medido: los nueve paneles que ve
        el planner la traen. Es lo único que quedaba de ese pedido — el grande,
        «`presentation` para las siete formas que no son escalares», lo habíamos
        retirado nosotros al descubrir que la lee un solo cuerpo.
      required: [id, metric_id, type, col_start, col_span, row_span, note, chart]
      properties:
        id: { type: string, format: uuid }
        metric_id: { type: string, format: uuid }
        type: { type: string }
        col_start: { type: integer, minimum: 1, maximum: 12 }
        col_span: { type: integer }
        row_span:
          type: integer
          description: 'En unidades de grilla: px = 96·N − 16.'
        options:
          type: object
          description: |
            **Interruptores, no datos.** Para `kpi` llega
            `{ "comparative": true, "meter": true }`: los booleanos dicen si
            mostrar, y los VALORES viajan en `presentation` del payload. El front
            hoy los busca acá, que es el bug de F1.40.
          additionalProperties: true
        chart:
          type: string
          description: |
            **QUÉ VARIANTE dibuja este panel** · pedido el 2026-09-28 y llegó el
            mismo día, medido contra `f70cec2` en los doce paneles.

            `type` elige el CUERPO y esto el dibujo de adentro. Hacían falta los
            dos porque **16 de los 49 gráficos sirven a más de una forma**.

            **Cadena vacía = el gráfico por defecto del cuerpo**, que es lo que
            los doce publicados hacen hoy. Por eso el campo es aditivo y no
            migra ningún layout.

            **Llega como `string` libre y lo cierra el adaptador**, igual que
            `shape`, `family` y `layer`: ellos lo guardan en minúsculas y
            recortado y **no lo validan contra el repertorio** —«eso es del
            front, que tiene los 49 y sus mínimos»—, así que un id desconocido
            puede llegar. El panel lo declara en vez de caer al de por defecto.
          examples: ['', 'waterfall', 'control']
        note:
          type: string
          description: |
            La nota de lectura del panel · **B1.13, llegó el 2026-09-28**.

            La escribe el admin en el builder —`panels[].note` de
            `PUT /admin/layouts/{id}`— y vive en el layout, no en el dato: por
            eso viaja acá y no en el payload.

            **Vacía cuando no hay**, no `null` · medido sobre los nueve paneles
            del planner. Un rol puede reemplazarla con
            `layout_overrides[tab_id][panel_id].note`.

            **Y también aparece mezclada en `presentation.note`** del payload de
            `panels:batch`: se une en lectura sin pisar `label`, `meter` ni
            `comparative`, y no se guarda en `dd_panel_data`.

    # ── /config/panels:batch ─────────────────────────────────────────────────

    BatchRequest:
      type: object
      required: [panel_ids, period]
      properties:
        panel_ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        period:
          type: string
          description: |
            `ParsePeriod` solo acepta `YYYY-MM` y rechaza cualquier otra cosa —
            ni días, ni semanas, ni rangos.
          examples: ['2026-08']

    Payload:
      type: object
      description: |
        `ports.DDPayloadDTO`. **No es una unión discriminada**: es un struct con
        campos `omitempty`, así que el tipo no impide un `BLOCKED` con valor ni
        un `AVAILABLE` sin gobierno. El contrato sí lo impide, y el adaptador es
        donde eso se vuelve a cerrar.

        `governance` va ANIDADO; el contrato lo intersecta en el payload.
      required: [status]
      properties:
        status:
          type: string
          description: |
            Las cinco constantes de `domain/dd_panel_data.go`. **En inglés**, y
            la guía de Postman del backend dice `DEGRADADO` — el código manda.
          enum: [AVAILABLE, DEGRADED, BLOCKED, FORBIDDEN, ERROR]
        governance: { $ref: '#/components/schemas/Governance' }
        value:
          description: |
            El JSON crudo de `dd_panel_data.value`. Discriminado por `shape`.
          type: object
          additionalProperties: true
        presentation:
          description: |
            **Solo se emite para `scalar` y `scalar_with_interval`.**
            `PresentationFromRows` devuelve `nil` para **todas las demás**, así
            que un panel de barras o de tabla llega sin rótulo.

            Decía «las otras siete» y eso se venció: el `switch` de
            `TransformValue` pasó de nueve formas a quince en `168a761`.
            Reverificado contra `1e080ee` el 2026-09-25 — el comportamiento de
            `PresentationFromRows` no cambió, el conteo sí. Se escribe sin número
            para que no vuelva a vencerse.
          type: object
          additionalProperties: true
        reason:
          type: string
          description: Razón del estado. En `DEGRADED` la redacta el servidor.
        unlocks_with:
          type: string
          description: |
            **Llega vacío en `BLOCKED`.** El servicio solo lo escribe al derivar
            `DEGRADED`. §8 pide estado, razón y qué lo desbloquea.
        message:
          type: string
          description: Solo en `ERROR`. Sale de `validatePanelOptions`.
        request_from:
          type: string
          description: |
            Solo en `FORBIDDEN`, y es **la constante `"admin"`** escrita en el
            código, no el rol que decide sobre la métrica.

            **Acá decía `"administrator"`, y no se había inventado: se
            VENCIÓ.** Ellos lo cambiaron y NOS LO AVISARON —
            `docs/RESPUESTA-2026-09-25-para-backend.md` §B1.6: «Hoy
            `request_from` en `FORBIDDEN` pasa de `"administrator"` a `"admin"`»,
            con su ejemplo de respuesta al lado. Se anotó en el documento y
            **nunca bajó al cable**, que es de donde sale el tipo.

            **Es un modo de falla distinto al de escribir de memoria y conviene
            tenerlo aparte**: nadie adivinó nada, el aviso llegó, se guardó en
            prosa, y la prosa no la lee `openapi-typescript`. Un cambio anunciado
            no está transcripto hasta que está en el cable.

            Medido el 2026-09-28 pidiéndole al token de `planner` los tres
            paneles que su rol oculta: los tres contestan
            `{"status":"FORBIDDEN","request_from":"admin"}` y nada más.
            `dd_config_service.go:726` lo declara —`const forbiddenRequestFrom =
            "admin"`—.

            **Es un literal, no un rol resuelto.** Si el rol de administración de
            un tenant se llamara `owner` o `Administrador`, el servicio seguiría
            diciendo `admin`. El adaptador lo pasa tal cual igual: redactarlo
            sería el front inventando a quién pedirle.

            **Y el payload de `FORBIDDEN` no trae nada más** — ni `reason` ni
            `unlocks_with`, que es la gramática de §8 que los otros estados sí
            traen. Pedido.
          examples: ['admin']

    Governance:
      type: object
      description: |
        `ports.DDGovernanceDTO`. Los campos que el contrato pide, con otros
        nombres y un nivel más abajo.
      required: [base, layer, source, freshness, catalog_version, measurement_window]
      properties:
        base: { type: string }
        layer: { type: string }
        source: { type: string }
        freshness:
          type: string
          description: |
            `materialized_at` en RFC 3339. **Cadena vacía** cuando el registro no
            tiene fecha de materialización, no `null`.
        catalog_version: { type: integer }
        # ── B1.25 · agregado el 2026-09-26, medido contra `8633b10` ───────────
        #
        # **Es la mitad que faltaba de la línea de BASE.** El shell pinta
        # `Base · {base} · {ventana}` y el adaptador tenía `ventana: ''` a mano
        # con un comentario de tres párrafos explicando que el cable no lo traía:
        # de ahí salía el separador colgando —`Base · COMPLETED · MONTH ·`— que
        # `CLAUDE.md` lista como «lo que se ve mal y es del backend».
        #
        # **Y NO es lo mismo que `base`.** `base` es el denominador —«Órdenes
        # totales del sitio medidas por Adobe Analytics»— y esto es la ventana
        # —«Mes calendario seleccionado»—. Dos períodos con el mismo id pueden
        # tener ventanas distintas.
        #
        # **Viene vacío en las métricas que no están en Snowflake.** Medido el
        # 2026-09-26: con valor en 4 de los 12 paneles y en 10 de las 18
        # métricas; las que faltan son las de la semilla, que la vista
        # `SYNAPSE_METRIC_CATALOG` no tiene. Vacío se lee como ausente.
        measurement_window:
          type: string
          description: |
            Ventana de medición **ya redactada**, de la columna
            `MEASUREMENT_WINDOW` de la vista. No se deriva del período.
          examples: ['Mes calendario seleccionado', 'Cada día del mes calendario seleccionado']

    # ── /config/chat · B3.1 · TRANSCRITO DE 82da946 ──────────────────────────

    ChatAskRequest:
      type: object
      description: |
        `ddChatRequest` de `dd_chat_handler.go`.

        **`panel_context` dejó de ser obligatorio · reverificado contra
        `75b8ecc` el 2026-09-25.** Ahora el handler exige **exactamente uno** de
        `panel_context` o `tab_context` —`if (req.PanelContext == nil) ==
        (req.TabContext == nil)` devuelve 400— y su propio comentario cita la
        tarea: «exactamente uno de panel_context o tab_context (F3.15)».

        **Es lo que pedimos el 2026-09-25 y lo hicieron el mismo día.** Y es lo
        que F3.15 esperaba: su candado dice «el cable exige un panel», y ya no.
        Queda anotado y **no se toma** — un candado vencido se dice y se
        pregunta.
      required: [question]
      properties:
        question: { type: string }
        tab_context:
          type: object
          description: |
            **La presencia del chat en la consola** · el `.pen` lo dibuja en las
            quince pantallas y colgaba de un panel. Con esto la pregunta puede
            ser de la pestaña entera.
          required: [tab_id, period]
          properties:
            tab_id: { type: string, format: uuid }
            period: { type: string, examples: ['2026-09'] }
        panel_context:
          type: object
          required: [panel_id, period]
          properties:
            panel_id: { type: string, format: uuid }
            period:
              type: string
              description: |
                `YYYY-MM`, validado con `^\d{4}-(0[1-9]|1[0-2])$` en
                `dd_chat_service.go`. Otro formato devuelve 400 con
                «período inválido, formato esperado YYYY-MM».
              examples: ['2026-09']
        thread_id:
          type: [integer, 'null']
          format: int64
          x-nota-de-error: |
            **ESTA RUTA NO TRADUCE SUS ERRORES DE BINDING**, y es la única de las
            nueve que medimos así. Medido el 2026-09-28 contra `f70cec2`:

                POST /config/chat  {}
                → "solicitud inválida: Key: 'ddChatRequest.question'
                   Error:Field validation for 'question' failed on the
                   'required' tag"

            Su respuesta del 2026-09-28 dice «Nunca aparece un nombre de struct
            de Go ni un tag», y en `PUT /config/me/preferences` es cierto —ahí
            sale `el campo 'theme' debe ser uno de: dark, light`—. **No es el
            anidamiento**: falla igual con un campo de primer nivel.

            Es por handler: `dd_chat_handler.go:52` manda
            `SendError(..., "solicitud inválida: "+err.Error())` donde los
            demás mandan `SendCodedError(..., BindingErrorMessage(err))`. De 32
            sitios que enlazan JSON, 9 pasan por el traductor.

            **Importa porque el front pinta este texto**: `ErrorState` muestra la
            frase del servicio tal cual, decidido así porque un lector genérico
            decía menos. Y cae justo en la ruta de F3.15.
          description: |
            **Es un ENTERO, no un uuid.** Sale del frame `thread_info` y es lo
            que continúa la conversación. Ausente en la primera pregunta.

    ChatFrameThreadInfo:
      type: object
      description: |
        `event: thread_info`. **Siempre es la primera trama**, la emite `pump`
        antes de abrir el stream del agente.
      required: [thread_id, parent_message_id, user_thread_id]
      properties:
        thread_id:
          type: integer
          format: int64
          description: El que se manda de vuelta en `ChatAskRequest.thread_id`.
        parent_message_id: { type: integer, format: int64 }
        user_thread_id:
          type: string
          format: uuid
          description: |
            El `:id` de `GET /config/chat/threads/{id}/messages`. **No sirve
            para continuar la conversación** — para eso va `thread_id`.

    ChatFrameThinking:
      type: object
      description: |
        `event: thinking`. **Tres formas distintas bajo un mismo nombre**, según
        de qué evento de Cortex salga: `{text}`, `{status, message}` o
        `{tool, status}`. Ninguna propiedad es obligatoria.
      properties:
        text: { type: string }
        status: { type: string }
        message: { type: string }
        tool: { type: string }

    ChatFrameDelta:
      type: object
      description: |
        `event: delta`. Un fragmento de la respuesta. Se concatenan en orden.
        **La clave es `text`**, no `delta` como en el contrato.
      required: [text]
      properties:
        text: { type: string }

    ChatFrameSQL:
      type: object
      description: |
        `event: sql`. El SQL que corrió el agente. **No trae fuentes
        consultadas ni límite declarado**: el agente los escribe dentro del
        markdown, como secciones `### Fuentes consultadas` y
        `### Límite declarado`.
      required: [sql]
      properties:
        sql: { type: string }
        tool: { type: string }

    ChatFrameData:
      type: object
      description: |
        `event: data`. Lo que `StructuredDataFromCortex` produjo.

        **`shape` es la FORMA del valor, no el tipo de panel**, y `provenance`
        **no trae la BASE ni la capa Medallion** — los dos huecos por los que
        F3.6 sigue bloqueada. Se transcribe igual: describir el cable no es
        usarlo.
      required: [shape, data, provenance]
      properties:
        shape:
          type: string
          description: |
            La forma de la métrica, o `tabular` si esa falló, o `raw` si no se
            pudo transformar nada.
        data: {}
        provenance:
          type: object
          description: |
            **Creció el 2026-09-22 con `55e8419`**, que es lo que destrabó F3.6.
            Antes traía sólo las cinco primeras y no alcanzaba: `EventoDato`
            exige `familia` y los cinco campos de `Gobierno`.
          required: [source, metric_key, period, sql_available, base, base_source, family, layer, source_system, catalog_version, freshness, queried_at]
          properties:
            source: { type: string, examples: ['cortex_agent'] }
            tool: { type: string }
            metric_key: { type: string }
            period: { type: string }
            sql_available: { type: boolean }

            base:
              type: string
              description: El denominador y la ventana de la métrica.
            base_source:
              type: string
              description: |
                `catalog` cuando la BASE salió del catálogo, vacío si no hay
                base. **Es la declaración de que la BASE es la de la MÉTRICA**,
                no una calculada para esta cifra en particular.
            family: { type: string, description: 'Con qué familia se pinta.' }
            layer: { type: string, description: 'La capa Medallion.' }
            source_system: { type: string }
            catalog_version: { type: integer }
            freshness:
              type: string
              description: |
                RFC 3339 de la **última materialización de la métrica**. Cadena
                vacía si nunca se materializó.
            queried_at:
              type: string
              description: |
                RFC 3339 del momento en que **el agente produjo esta cifra**.
                Lo pone el servicio al recibir el `tool_result`, así que sólo
                viene cuando el agente consultó de verdad.

                **No es lo mismo que `freshness` y confundirlos es el bug**: una
                describe cuándo se materializó el panel y la otra cuándo se
                calculó este número.

    ChatFrameError:
      type: object
      description: |
        `event: error`. Terminal: siempre lo sigue un `done`.

        **No declara si lo ya recibido sigue valiendo**, que es el `parcial` del
        contrato. Lo que sí hace el servicio es persistir la respuesta
        acumulada —`defer s.persistAssistant(st)` en `pump`— antes de cerrar.
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            `upstream_error` cuando el agente falla sin código propio, y
            `empty_stream` cuando el stream cerró sin texto, sin dato y sin
            error.
        message: { type: string }

    ChatFrameDone:
      type: object
      description: |
        `event: done`. **El objeto vacío `{}`**: no trae el id del hilo. El id
        llegó en `thread_info`, al principio.

    ChatThread:
      type: object
      description: |
        `ports.DDChatThreadDTO`. Un hilo del chat contextual, ya cruzado con el
        tab y la métrica de donde salió.

        **Los dos ids no son intercambiables, y confundirlos es el bug.**
        `id` es el uuid de `user_threads` y es el `:id` de
        `GET /config/chat/threads/{id}/messages`; `thread_id` es el entero que
        se manda de vuelta en `ChatAskRequest.thread_id` para continuar la
        conversación. Mandar el uuid donde va el entero da 400.

        **Casi todo lo del panel es opcional**: los hilos abiertos antes de que
        existiera el contexto de panel no lo tienen.
      required: [id, thread_id, thread_name, agent_id, agent_name, role, first_message_preview, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        thread_id: { type: integer, format: int64 }
        thread_name: { type: string }
        agent_id: { type: string, format: uuid }
        agent_name: { type: string }
        role: { type: string }
        first_message_preview:
          type: string
          description: La primera pregunta del hilo, tal como se escribió.
        last_message_id: { type: [integer, 'null'], format: int64 }
        panel_id: { type: [string, 'null'], format: uuid }
        period:
          type: string
          description: |
            `YYYY-MM`. **Cadena vacía cuando el hilo no tiene panel**, no
            `null`: el struct lo declara `string` con `omitempty`.
        tab_id: { type: [string, 'null'], format: uuid }
        tab_name: { type: string }
        metric_id: { type: [string, 'null'], format: uuid }
        metric_key: { type: string }
        metric_name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChatSuggestion:
      type: object
      description: |
        `ports.DDChatSuggestion`. Una pregunta que el servicio propone para este
        panel.
      required: [question, intent]
      properties:
        question:
          type: string
          description: La pregunta, ya redactada en español y lista para mandar.
        intent:
          type: string
          description: |
            `explain`, `compare`, `drivers`, `breakdown`, `forecast` o `data`.

            **El front no lo usa y por eso el adaptador lo descarta.** §PEN:C3
            dibuja las sugeridas como chips con su texto y nada más; conservar
            un campo que ninguna pantalla lee es cómo `BodyProps.presentation`
            estuvo meses declarada sin un solo consumidor.
      examples:
        - question: '¿Por qué Ventas está en USD 4.28M en septiembre?'
          intent: explain
