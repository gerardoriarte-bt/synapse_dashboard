  #   handler/dd_drilldown_handler.go            el handler · `sendError` y sus ocho ramas
  #   core/ports/dd_drilldown_service.go         los dos DTO con sus json tags
  #   core/services/dd_drilldown_service.go      autorización, límites, Snowflake
  #   core/dashboard/snowflake/drilldown.go      `DrillRegistry` · qué dimensión existe
