# La puerta, en cada PR · ISO 27001 A.8.25 y A.8.32 · 2026-11-09
#
# Brecha 2 de `docs/AUDITORIA-2026-11-04-hardening-iso-27001.md`: `npm run
# verify` existía y era buena, pero corría sólo en la máquina de quien empujaba
# y se podía no correr. Esto la vuelve una condición del PR. **Para que sea
# obligatoria falta proteger `main`** en la configuración del repositorio, que
# es un paso de quien lo administra.
#
# ── LO QUE ACÁ SALE BLOQUEADO, Y POR QUÉ ESTÁ BIEN ──────────────────────────
#
# `afirmaciones` busca los commits citados en los repositorios del backend, y
# acá no están. Sin ellos sale ⊘ BLOQUEADO con la cuenta de los que no pudo
# buscar, y la puerta lo dice aparte: no los da por falsos ni por buenos. En la
# máquina de quien escribe sí están, y ahí se verifican todos.

name: verify

on:
  pull_request:
  push:
    branches: [main]

# Sólo leer: este workflow no publica, no comenta y no escribe nada.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Las acciones van por SHA y no por etiqueta: una etiqueta se puede mover,
      # y lo que corre acá tiene el código entero. La versión va al lado.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # **La historia entera**: `afirmaciones` exige que cada commit citado
          # sea alcanzable desde una rama, y con la copia superficial por
          # defecto no hay ramas ni historia donde buscarlo.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # La misma mayor que la imagen · ver el `Dockerfile`.
          node-version: 22
          cache: npm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # La única dependencia de las herramientas fuera de la biblioteca estándar.
      - run: pip install pyyaml==6.0.2

      - run: npm ci

      - run: npm run verify

  # ── LA IMAGEN SE ESCANEA · ISO 27001 A.8.8 · 2026-11-09 ─────────────────────
  #
  # **Lo encontró la primera corrida, antes de existir este job**: la imagen de
  # `main` —sobre `nginx:1.27-alpine`, Alpine 3.21.3— tenía 67 vulnerabilidades
  # altas o críticas, tres críticas y una de ellas en OpenSSL, todas con
  # arreglo. Ninguna era de nuestro código: la base había envejecido sin que
  # nadie mirara. Con la base nueva, cero.
  #
  # **Falla sólo con lo que tiene arreglo** (`--ignore-unfixed`): una
  # vulnerabilidad sin parche no se resuelve en un PR, y un rojo que no se
  # puede poner en verde termina apagado. **No es obligatorio para mergear**:
  # una CVE nueva en la base no es culpa del PR que la descubre. Avisa en rojo
  # y el arreglo es el PR de Dependabot que renueva el digest.
  #
  # Trivy corre desde su imagen oficial, fijada por digest, y no desde una
  # acción de terceros: es una dependencia menos con acceso al runner.
  imagen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: docker build -t synapse-front:ci .

      - name: Trivy · altas y críticas con arreglo
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress synapse-front:ci
